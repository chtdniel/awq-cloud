name = "awq-cron"
main = "index.js"
compatibility_date = "2024-03-20"

[triggers]
# 30 min: live TAFs. 4 h: WX WARNING feed (JTWC TC warnings, VAAC advisories,
# VA/TC SIGMETs). The worker dispatches on event.cron.
crons = ["*/30 * * * *", "0 */4 * * *"]

[[d1_databases]]
binding = "DB"
database_name = "awq-db"
database_id = "470bf61d-b694-4d4d-a716-0b74f56a5a8a"
