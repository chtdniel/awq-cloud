<!--
  FIR_Ui.html — FIR Dispatch Control (map-first) parity module.
  Ported from the standalone "FIR DISPATCH CONTROL" Vue app into the
  dashboard shell (vanilla JS, window.* pattern). Provides:
    - Active flight board + picker
    - Leaflet vector map with route geometry (Route + LATLONG sheets, or
      airport coordinate fallback)
    - Active NOTAM layer (markers, polygons, radius circles)
    - NOTAM hazard inspector for the selected flight
    - Batch risk analysis table + persist (RISK LEVEL column)
  Loaded into #view-fir via Index.html. Leaflet loads lazily via window.occEnsureLeaflet on first tab open.
-->
<style>

<div class="fir-ui" id="fir-ui-root">
  <!-- Left: flight board -->
  <div class="fir-board-panel">
    <div class="fir-panel-head">
      <span class="fir-panel-title">Flight Board</span>
      <div style="display:flex; gap:6px;">
        <button type="button" class="fir-map-btn" id="fir-refresh-flights" title="Refresh flight list">
          <svg class="ic"><use href="#i-sync"/></svg> REFRESH
        </button>
        <button type="button" class="fir-map-btn" id="fir-analyze-all">ANALYZE</button>
      </div>
    </div>
    <div class="fir-board-scroll" id="fir-flight-list">
      <div class="fir-empty">Loading active flights...</div>
    </div>
  </div>

  <!-- Middle: Hazard Stack (Option A — dedicated full-height column) -->
  <div class="fir-hazard-panel" id="fir-hazard-panel">
    <div class="fir-hazard-head" id="fir-hazard-head">
      <div class="fir-empty">Select a flight to view hazard stack.</div>
    </div>
    <div class="fir-hazard-tools">
      <input type="search" class="fir-hazard-search" id="fir-hazard-search" aria-label="Search selected flight hazards" placeholder="Search NOTAM # / text...">
<style>.fir-hazard-search:focus-visible { outline: 3px solid var(--accent-primary); outline-offset: 2px; }</style>
      <span class="fir-hazard-count" id="fir-hazard-count" role="status" aria-atomic="true">0 shown of 0</span>
    </div>
    <div class="fir-hazard-chips" id="fir-hazard-chips" aria-label="Filter selected flight hazards"></div>

    </div>
  </div>

  <!-- Right: map -->

    <div class="fir-map-tools">
      <button type="button" class="fir-map-btn" id="fir-toggle-notams">NOTAM LAYER</button>
      <button type="button" class="fir-map-btn" id="fir-expand-map" title="Expand map (F / ESC)">⛶ EXPAND</button>
      <span class="fir-notam-status" id="fir-notam-status">NOTAM: —</span>

    </div>

</div>

<script>
(function () {
  if (window.firUiInited) return;
  window.firUiInited = true;

  const esc = window.escapeHtml;

  const state = {
    map: null,
    flights: [],
    routes: [],
    latlong: [],
    notams: [],
    showNotams: false,
    selected: null,
    markers: [],
    notamLayerGroup: null,
    notamGeomLayers: [],
    notamShapeLayer: null,
    notamPopup: null,
    latLongCache: null,
    mapFirFilter: null,
    hazards: [],
    hzQuery: '',
    hzRisk: '',
    hzStatus: 'ACTIVE',  // default hanya ACTIVE — pilih 'ALL' untuk tampilkan FUTURE/EXPIRED juga
    flightDataLoaded: false, // Track if flight data has been loaded
    initialized: false,
    flightLoadRequest: 0
  };
  // Exposed for FIR NOTAM UI to filter map by selected FIR tab
  window.firSetMapFirFilter = function(loc) {
    state.mapFirFilter = loc ? String(loc).trim().toUpperCase() : null;
    if (state.showNotams) updateNotamLayer();
    if (state.selected) updateMapForFlight(state.selected);
    if (loc) addToast('Map filter: ' + loc);
  };

  function addToast(msg) {
    let t = document.querySelector('.fir-toast');
    if (!t) { t = document.createElement('div'); t.className = 'fir-toast'; document.body.appendChild(t); }
    t.textContent = msg;
    t.style.display = 'block';
    clearTimeout(window.__firToastTimer);
    window.__firToastTimer = setTimeout(() => { t.style.display = 'none'; }, 2600);
  }

  /* ---------- Backend helpers ---------- */
  function run(fnName) {
    const args = Array.prototype.slice.call(arguments, 1);

    if (p.radiusNm) h += '<div style="color:var(--text-muted);font-size:10px;">◯ Radius ' + esc(p.radiusNm) + ' NM</div>';
    if (pPolygon.length >= 3) h += '<div style="color:var(--text-muted);font-size:10px;">△ Polygon ' + esc(pPolygon.length) + ' points</div>';
    h += '</div>';
    return h;
  }
  function clearNotamShape() {
    if (!state.map) return;
    try { if (state.notamShapeLayer) { state.map.removeLayer(state.notamShapeLayer); state.notamShapeLayer = null; } } catch(e){}
  }
  function drawNotamShape(p) {
    clearNotamShape();
    if (!state.map) return;
    const riskColor = p.risk === 'HIGH' ? '#ef5350' : p.risk === 'MEDIUM' ? '#fb923c' : '#34d399';
    const geom = buildNotamGeom(p);
    if (!geom || !geom.length) return;
    try {
      const latlngs = geom.map(c => [c[1],c[0]]);
      state.notamShapeLayer = L.layerGroup().addTo(state.map);
      if (latlngs.length >= 3) {
        L.polygon(latlngs, { color:riskColor, weight:2, dashArray:'3 2', fillColor:riskColor, fillOpacity:0.15 }).addTo(state.notamShapeLayer);
      } else {
        L.polyline(latlngs, { color:riskColor, weight:2, dashArray:'3 2' }).addTo(state.notamShapeLayer);
      }
    } catch (e) {}
  }
  function openNotamPopup(props, lat, lon) {
    if (!state.map) return;
    if (state.notamPopup) state.map.closePopup(state.notamPopup);
    state.notamPopup = L.popup({ className:'fir-notam-popup', maxWidth:320 }).setLatLng([lat,lon]).setContent(buildNotamPopupHtml(props)).openOn(state.map);
  }
  function ensureNotamGroup() {
    if (!state.notamLayerGroup) { state.notamLayerGroup = L.layerGroup(); if (state.map) state.notamLayerGroup.addTo(state.map); }
    return state.notamLayerGroup;
  }
  function clearNotamGroup() {
    if (!state.notamLayerGroup) return;
    try { state.notamLayerGroup.getLayers().forEach(l => { if (state.map && state.map.hasLayer(l)) state.map.removeLayer(l); }); state.notamLayerGroup.clearLayers(); } catch(e){}
  }
  function updateNotamLayer() {
    if (!state.map) { if (typeof L !== 'undefined') { try { initMap(); } catch(e){} } return; }
    try { if (state.notamPopup) { state.map.closePopup(state.notamPopup); state.notamPopup = null; } } catch(e){}
    clearNotamGroup();
    state.notamGeomLayers = [];
    let rendered = 0, geomCount = 0;
    const firFilter = state.mapFirFilter ? String(state.mapFirFilter).trim().toUpperCase() : null;
    (state.notams || []).forEach(n => {
      const ll = getNotamLatLon(n); if (!ll) return;
      const lat = ll[0], lon = ll[1];
      const location = nfield(n,'location','Location','LOCATION','FIR','FIR ID','ICAO');
      if (firFilter && String(location || '').trim().toUpperCase() !== firFilter) return;
      const number = nfield(n,'number','Number','NOTAM #','NOTAM NUMBER','ID');
      const risk = nfield(n,'risk','Risk','RISK LEVEL') || 'LOW';
      const text = nfield(n,'text','Text','NOTAM Text','NOTAM_TEXT','NOTAMTEXT');
      const center = nfield(n,'center','Center','CENTRE');
      const radiusNm = nfield(n,'radiusNm','Radius NM','RADIUS');
      const polygon = nfield(n,'polygon','Polygon','POLYGON');
      const cls = nfield(n,'cls','Class','CLASS');
      const active = n.active !== false && String(n.status || '').toUpperCase() !== 'EXPIRED';
      const radius = !active ? 4 : risk === 'HIGH' ? 9 : risk === 'MEDIUM' ? 7 : 5;
      const color = !active ? '#5a5f66' : risk === 'HIGH' ? '#ef5350' : risk === 'MEDIUM' ? '#fb923c' : '#34d399';
      const props = {
        location: location !== undefined ? location : n.location,
        number: number !== undefined ? number : n.number,
        cls: cls || null, active, risk, text,
        effectiveDate: n.effectiveDate || null, expirationDate: n.expirationDate || null,
        center: (Array.isArray(center) && center.length === 2) ? center : [lon, lat],
        radiusNm: radiusNm || null,
        polygon: normalizePolygon(polygon !== undefined ? polygon : n.polygon)
      };
      const ring = buildNotamGeom(props);
      if (ring.length >= 3 && state.showNotams) {
        const latlngs = ring.map(c => [c[1],c[0]]);
        const geom = L.polygon(latlngs, { color, weight: active?2:1, dashArray:'4 3', fillColor:color, fillOpacity: active?0.12:0.05 });
        geom.bindTooltip(String(props.location != null ? props.location : location), { className:'notam-tooltip' });
        geom.on('click', () => { clearNotamShape(); drawNotamShape(props); openNotamPopup(props, lat, lon); });
        geom.addTo(ensureNotamGroup()); state.notamGeomLayers.push(geom); geomCount++;
      }
      const marker = L.circleMarker([lat,lon], { pane:'notam-points', radius, color:'#0b0d12', weight: active?1.5:0.5, fillColor:color, fillOpacity: state.showNotams ? 0.9 : 0 });
      marker.bindTooltip(String(props.location != null ? props.location : location), { direction:'top', offset:[0,-radius], className:'notam-tooltip' });
      marker.on('click', () => { clearNotamShape(); drawNotamShape(props); openNotamPopup(props, lat, lon); });
      if (state.showNotams) marker.addTo(ensureNotamGroup());
      rendered++;
    });
    const filterSuffix = firFilter ? ' · FIR ' + firFilter : '';
    document.getElementById('fir-notam-status').textContent = 'NOTAM: ' + rendered + '/' + (state.notams||[]).length + ' rendered, ' + geomCount + ' geom' + filterSuffix + (rendered===0?' (fallback)':'');
  }
  function toggleNotamLayer() {
    state.showNotams = !state.showNotams;
    const btn = document.getElementById('fir-toggle-notams');
    if (btn) btn.classList.toggle('active', state.showNotams);
    if (!state.map) { try { initMap(); } catch(e){} }
    if (state.showNotams) { updateNotamLayer(); if (state.notamLayerGroup && !state.map.hasLayer(state.notamLayerGroup)) state.notamLayerGroup.addTo(state.map); }
    else { clearNotamGroup(); clearNotamShape(); if (state.notamPopup) { state.map.closePopup(state.notamPopup); state.notamPopup = null; } }
    if (state.selected) updateMapForFlight(state.selected);
  }

  // Fullscreen / expand map — ponytail: CSS :fullscreen + fallback .is-fullscreen so it works in iframe
  function isMapExpanded() {
    const root = document.getElementById('fir-ui-root');
    return document.fullscreenElement === document.getElementById('fir-map-wrap')
        || document.webkitFullscreenElement === document.getElementById('fir-map-wrap')
        || document.getElementById('fir-map-wrap').classList.contains('is-fullscreen')
        || (root && root.classList.contains('is-expanded'));
  }
  function syncExpandBtn() {
    const btn = document.getElementById('fir-expand-map');
    if (!btn) return;
    btn.textContent = isMapExpanded() ? '✕ CLOSE' : '⛶ EXPAND';
    btn.classList.toggle('active', isMapExpanded());
    btn.title = isMapExpanded() ? 'Close (ESC / F)' : 'Expand map (F)';
  }
  function expandMap() {
    const wrap = document.getElementById('fir-map-wrap');
    const root = document.getElementById('fir-ui-root');
    
    // Try native fullscreen first; iframe/denied -> fallback flex expansion
    const req = wrap.requestFullscreen || wrap.webkitRequestFullscreen;
    if (req) {
      const p = req.call(wrap);
      if (p && p.catch) {
        p.catch(() => { 
          // Native fullscreen failed, use flex-based expansion
          root.classList.add('is-expanded');
          syncExpandBtn(); 
          setTimeout(() => { if(state.map) state.map.invalidateSize(); }, 80); 
        });
      } else {
        // Native fullscreen succeeded, but we'll still apply flex styling as backup
        setTimeout(() => { 
          root.classList.add('is-expanded');
          syncExpandBtn(); 
          if(state.map) state.map.invalidateSize(); 
        }, 250);
      }
    } else {
      // No fullscreen API support, use flex expansion
      root.classList.add('is-expanded');
      syncExpandBtn();
    }
    setTimeout(() => { if(state.map) state.map.invalidateSize(); }, 120);
    setTimeout(() => { if(state.map) state.map.invalidateSize(); }, 350);
  }
  function closeMapExpand() {
    const wrap = document.getElementById('fir-map-wrap');
    const root = document.getElementById('fir-ui-root');
    
    if (document.fullscreenElement || document.webkitFullscreenElement) {
      const ex = document.exitFullscreen || document.webkitExitFullscreen;
      if (ex) {
        ex.call(document).then(() => {
          // Clean up both fullscreen fallback modes
          wrap.classList.remove('is-fullscreen');
          root.classList.remove('is-expanded');
          syncExpandBtn();
          setTimeout(() => { if(state.map) state.map.invalidateSize(); }, 80);
          setTimeout(() => { if(state.map) state.map.invalidateSize(); }, 300);
        });
        return;
      }
    }
    
    // Always remove expansion classes from parent container
    wrap.classList.remove('is-fullscreen');
    root.classList.remove('is-expanded');
    syncExpandBtn();
    setTimeout(() => { if(state.map) state.map.invalidateSize(); }, 80);
    setTimeout(() => { if(state.map) state.map.invalidateSize(); }, 300);
  }
  function toggleMapExpand() { if (isMapExpanded()) closeMapExpand(); else expandMap(); }

  function initMap() {
    console.log('[FIR] Initializing Leaflet map...');
    if (state.map || typeof L === 'undefined') {
      console.warn('[FIR] Map already initialized or Leaflet not available');
      return;
    }
    
    try {
      state.map = L.map('fir-map', { 
        center:[-2.5,118.0], 
        zoom:4, 
        zoomControl:false, 
        attributionControl:true 
      });
      
      console.log('[FIR] Map container created');
      
      if (!state.map.getPane('notam-points')) {
        state.map.createPane('notam-points').style.zIndex = 450;
      }
      
      // Try OSM first, with fallback to CartoDB if blocked
      let tileLayerAdded = false;
      
      // First try external tiles (might work in some cases)
      const tileProviders = [
        {
          url: 'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
          name: 'OpenStreetMap',
          options: { subdomains:'abc', maxZoom:19 }
        },
        {
          url: 'https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}.png',
          name: 'CartoDB Positron', 
          options: { maxZoom: 20 }
        }
      ];
      
      for (const provider of tileProviders) {
        try {
          L.tileLayer(provider.url, { 
            ...provider.options,
            attribution:'&copy; Contributors' 
          }).addTo(state.map);
          tileLayerAdded = true;
          console.log(`[FIR] ${provider.name} tiles loaded successfully`);
          break;
        } catch(e) {
          console.warn(`[FIR] ${provider.name} failed:`, e.message);
        }
      }
      
      // If all external providers fail, use simple colored placeholder
      if (!tileLayerAdded) {
        console.log('[FIR] All external tiles failed, using offline placeholder...');
        
        // Create a simple colored grid background instead of tiles
        const mapDiv = document.getElementById('fir-map');
        const width = mapDiv.offsetWidth || 400;
        const height = mapDiv.offsetHeight || 400;
        
        mapDiv.innerHTML = `<div style="width:100%;height:100%;background:linear-gradient(135deg,#e8f4f8 0%,#d1e8f0 100%);display:flex;align-items:center;justify-content:center;color:#3a5a7a;font-family:sans-serif;text-align:center;padding:20px;">
          <div>
            <h3 style="margin-bottom:8px;font-size:18px;">🗺️ FIR Interactive Map</h3>
            <p style="font-size:14px;margin-bottom:6px;">Interactive flight tracking and NOTAM visualization</p>
            <p style="font-size:12px;color:var(--text-muted);margin-top:12px;">Map tiles are displayed when available.</p>
          </div>
        </div>`;
        
        // Add a subtle animation effect
        mapDiv.querySelector('div').style.animation = 'pulse 2s ease-in-out infinite';
        
        // Inject keyframe animation
        if (!document.getElementById('map-animation-style')) {
          const style = document.createElement('style');
          style.id = 'map-animation-style';
          style.textContent = `
            @keyframes pulse {
              0%, 100% { opacity: 1; }
              50% { opacity: 0.7; }
            }
          `;
          document.head.appendChild(style);
        }
      }
      
      if (tileLayerAdded) {
        window.addEventListener('resize', () => { if (state.map) state.map.invalidateSize(); });
        console.log('[FIR] Map resize listener added');
        
        setTimeout(() => {
          updateNotamLayer();
          if (state.selected) {
            updateMapForFlight(state.selected);
            console.log('[FIR] Flight updated on map');
          }
        }, 100);
      }
    } catch (e) {
      console.error('[FIR] Map initialization failed:', e);
      alert('Failed to initialize map: ' + String(e.message || e));
    }
  }

  /* ---------- Inspector (Option A: Hazard-First middle column) ---------- */
  function renderInspector(flight) {
    const headBox = document.getElementById('fir-hazard-head');
    const listBox = document.getElementById('fir-hazard-list');
    if (!flight) {
      headBox.innerHTML = '<div class="fir-empty">Select a flight to view hazard stack.</div>';
      document.getElementById('fir-hazard-chips').innerHTML = '';
      document.getElementById('fir-hazard-count').textContent = '0 shown of 0';
      listBox.innerHTML = '<div class="fir-empty">No hazards yet.</div>';
      state.hazards = [];
      return;
    }
    state.hazards = flight.analysis || [];
    let h = '';
    h += '<div style="display:flex;justify-content:space-between;align-items:center;gap:12px;">';
    h += '<div><div class="fir-eyebrow">Selected Flight</div>';
    h += '<div class="fir-flt-name">' + esc(flight.QZ) + ' &middot; ' + esc(flight.DEP) + ' &rarr; ' + esc(flight.DES) + '</div>';
    h += '<div class="fir-flt-sub">Schedule ' + esc(formatTime(flight.STD)) + ' / ' + esc(formatTime(flight.STA)) + ' UTC &middot; FL' + esc(flight['CRZ FL'] || '&mdash;') + ' &middot; DOF ' + esc(formatDate(flight.DOF)) + ' &middot; REG ' + esc(flight.REG || 'N/A') + '</div></div>';
    h += '<div>' + riskBadge(flight.riskLevel) + '</div>';
    h += '</div>';
    const flg = flight.flags || {};
    if (flg.firMapped === false || flg.routeMapped === false || flg.dofInvalid) {
      const notes = [];
      if (flg.firMapped === false) notes.push('NO FIR MAPPING');
      if (flg.routeMapped === false) notes.push('NO ROUTE');
      if (flg.dofInvalid) notes.push('DOF INVALID');
      h += '<div style="margin:10px 0;padding:6px 10px;border:1px solid var(--status-warning);border-radius:var(--radius-sm);background:var(--status-warning-bg);color:var(--status-warning);font:700 10px var(--font-mono);">&#9888; ' + esc(notes.join(' &middot; ')) + '</div>';
    }
    h += '<div class="fir-eyebrow" style="margin-top:10px;">Traversed FIR Boundaries</div><div class="fir-fir-pills" style="margin-top:4px;">';
    const firs = getFIRArray(flight);
    if (firs.length) firs.forEach(f => { h += '<span class="fir-pill">' + esc(f) + '</span>'; }); else h += '<span style="font-size:11px;color:var(--text-muted);">None specified</span>';
    h += '</div>';
    headBox.innerHTML = h;
    renderHazardChips();
    renderHazardList();
  }

  function hazardFiltered() {
    const q = (state.hzQuery || '').toLowerCase();
    return (state.hazards || []).filter(n => {
      const risk = String(n.risk || 'LOW').toUpperCase();
      if (state.hzRisk && risk !== state.hzRisk) return false;
      const st = (n.active === false || String(n.status || '').toUpperCase() === 'EXPIRED') ? 'EXPIRED'
        : (String(n.status || '').toUpperCase() === 'FUTURE' ? 'FUTURE' : 'ACTIVE');
      if (state.hzStatus && state.hzStatus !== 'ALL' && st !== state.hzStatus) return false;
      if (q && !(String(n.location||'') + ' ' + String(n.number||'') + ' ' + String(n.text||'')).toLowerCase().includes(q)) return false;
      return true;
    });
  }

  function renderHazardChips() {
    const box = document.getElementById('fir-hazard-chips');
    const countEl = document.getElementById('fir-hazard-count');
    const all = state.hazards || [];
    const count = (r) => all.filter(n => String(n.risk || 'LOW').toUpperCase() === r).length;
    const opts = [['', 'ALL', all.length], ['HIGH', 'HIGH', count('HIGH')], ['MEDIUM', 'MEDIUM', count('MEDIUM')], ['LOW', 'LOW', count('LOW')]];
    let h = '<span class="fir-hazard-filter-label">Risk</span>';
    opts.forEach(o => {
      const active = state.hzRisk === o[0];
      h += '<button type="button" class="fir-hz-chip' + (active ? ' active' : '') + '" data-r="' + o[0] + '" aria-pressed="' + active + '">' + o[1] + '<span class="fir-hz-chip-count">' + o[2] + '</span></button>';
    });
    // Status filter: ALL default menampilkan semua, ACTIVE hanya yang berlaku sekarang
    h += '<span class="fir-hazard-filter-label" style="margin-left:8px;">Status</span>';
    const stCount = (s) => all.filter(n => {
      const st = (n.active === false || String(n.status || '').toUpperCase() === 'EXPIRED') ? 'EXPIRED'
        : (String(n.status || '').toUpperCase() === 'FUTURE' ? 'FUTURE' : 'ACTIVE');
      return s === 'ALL' || st === s;
    }).length;
    [['ALL', 'ALL', stCount('ALL')], ['ACTIVE', 'ACT', stCount('ACTIVE')], ['FUTURE', 'FUT', stCount('FUTURE')], ['EXPIRED', 'EXP', stCount('EXPIRED')]].forEach(o => {
      const on = state.hzStatus === o[0];
      h += '<button type="button" class="fir-hz-chip' + (on ? ' active' : '') + '" data-s="' + o[0] + '" aria-pressed="' + on + '">' + o[1] + '<span class="fir-hz-chip-count">' + o[2] + '</span></button>';
    });
    box.innerHTML = h;
    const filteredLen = hazardFiltered().length;
    countEl.textContent = filteredLen + ' shown of ' + all.length;
    box.querySelectorAll('[data-r]').forEach(el => el.addEventListener('click', () => {
      state.hzRisk = el.getAttribute('data-r');
      renderHazardChips();
      renderHazardList();
    }));
    box.querySelectorAll('[data-s]').forEach(el => el.addEventListener('click', () => {
      state.hzStatus = el.getAttribute('data-s');
      renderHazardChips();
      renderHazardList();
    }));
  }

  function renderHazardList() {
    const box = document.getElementById('fir-hazard-list');
    const list = hazardFiltered();
    document.getElementById('fir-hazard-count').textContent = list.length + ' shown of ' + (state.hazards || []).length;
    if (!list.length) {
      const hasHazards = (state.hazards || []).length > 0;
      box.innerHTML = hasHazards ? '<div class="fir-empty">No hazards match current filter.</div>' : '<div class="fir-empty">No direct NOTAM impact found for current flight context.</div>';
      return;
    }
    let h = '';
    list.forEach(n => {
      const risk = String(n.risk || 'LOW').toUpperCase();
      h += '<div class="fir-hazard-item ' + getRiskClass(risk) + '">';
      h += '<div class="fir-hazard-head"><span class="fir-hazard-id">' + esc(n.location) + ' - ' + esc(n.number) + '</span>' + riskBadge(risk) + '</div>';
      h += '<div class="fir-hazard-text">' + esc(n.text) + '</div>';
      h += '<div class="fir-hazard-meta">' + esc(String(n.status || 'ACTIVE')) + (n.isIndirectImpact ? ' &middot; INDIRECT' : '') + '</div>';
      if (n.matchReason) h += '<div class="fir-hazard-reason">Conflict: ' + esc(n.matchReason) + '</div>';
      h += '<div class="fir-hazard-actions"><button type="button" class="fir-map-btn" data-focus="' + esc(n.location + '|' + n.number) + '">Focus on Map</button></div>';
      h += '</div>';
    });
    box.innerHTML = h;
    box.querySelectorAll('[data-focus]').forEach(btn => {
      btn.addEventListener('click', (e) => {
        if (e) { e.preventDefault(); e.stopPropagation(); }
        const raw = btn.getAttribute('data-focus') || '';
        const sep = raw.indexOf('|');
        const loc = sep > -1 ? raw.slice(0, sep) : raw;
        const num = sep > -1 ? raw.slice(sep + 1) : '';
        const match = (state.hazards || []).find(x => String(x.location) === loc && String(x.number) === num) || { location: loc, number: num };
        focusHazardOnMap(match);
      });
    });
  }

  function focusHazardOnMap(n) {
    if (!n) return;
    try {
      // Prevent page scroll-jump if already on FIR tab
      const isFirActive = document.getElementById('view-fir') && document.getElementById('view-fir').classList.contains('active');
      if (!isFirActive && typeof window.switchTab === 'function') {
        window.switchTab('fir');
      }
      if (typeof window.firFocusNotamOnMap === 'function') {
        // Call without switchTab side-effect — firFocusNotamOnMap itself also tries to switch,
        // but we have already ensured the tab is active, so it will be a no-op (early return in switchTab logic)
        window.firFocusNotamOnMap(n);
      } else if (state.map) {
        const ll = getNotamLatLon(n);
        if (ll) state.map.setView([ll[0], ll[1]], 8);
      }
      addToast('Focused on map: ' + n.location + ' ' + n.number);
    } catch (err) {
      console.error('focusHazardOnMap error', err);
      addToast('Focus failed: ' + (err && err.message ? err.message : String(err)));
    }
  }

  function renderFlightList() {
    const box = document.getElementById('fir-flight-list');
    if (!box) return;
    
    // Update refresh button appearance based on state
    const refreshBtn = document.getElementById('fir-refresh-flights');
    if (refreshBtn && !state.flightDataLoaded) {
      refreshBtn.style.opacity = '0.6';
    } else if (refreshBtn) {
      refreshBtn.style.opacity = '1';
    }
    
    if (!state.flights.length) {
      box.innerHTML = state.flightDataLoaded
        ? '<div class="fir-empty">No flights on Flight Board.<br><span style="font-size:10px;opacity:.7;">Add flights to the board in FLIGHT tab first.</span></div>'
        : '<div class="fir-empty">Loading active flights...</div>';
      return;
    }
    
    let h = '';
    state.flights.forEach(f => {
      const active = state.selected && state.selected._rowId === f._rowId;
      h += '<div class="fir-flight-item' + (active ? ' active' : '') + '" data-row="' + f._rowId + '">';
      h += '<div class="fir-flt-line"><span class="fir-callsign">' + esc(f.QZ) + '</span>' + riskBadge(f.riskLevel) + '</div>';
      h += '<div class="fir-route">' + esc(f.DEP) + ' → ' + esc(f.DES) + '</div>';
      h += '<div class="fir-flt-sub"><span>' + esc(formatDate(f.DOF)) + '</span><span>' + esc(formatTime(f.STD)) + '/' + esc(formatTime(f.STA)) + 'Z</span></div>';
      h += '</div>';
    });
    box.innerHTML = h;
    box.querySelectorAll('.fir-flight-item').forEach(el => {
      el.addEventListener('click', () => selectFlight(Number(el.getAttribute('data-row'))));
    });
  }

  async function loadActiveNotams() {
    const data = await run('getActiveNotams', true);
    if (data && !data.error) {
      // Semua status dimuat (ACTIVE/FUTURE/EXPIRED) — status chip di hazard list mengatur tampilan.
      state.notams = data.notams || [];
    }
    if (!state.notams.length) state.notams = [];
    updateNotamLayer();
    const cnt = state.notams.filter(n => n.active !== false).length;
    document.getElementById('fir-notam-status').textContent = 'NOTAM: ' + cnt + ' active / ' + state.notams.length;
  }

  async function selectFlight(rowId) {
    const row = Number(rowId);
    const boardFlight = state.flights.find(f => Number(f._rowId) === row);
    if (!boardFlight) return;

    // Load full flight fields (ROUTE ID, CRZ FL, FIR 1..8) plus route/latlong
    // sheets so route geometry and the inspector render correctly.
    const full = await run('getSelectedFlightsData', [row], true);
    let flight = boardFlight;
    if (full && !full.error && full.flights && full.flights.length) {
      flight = full.flights[0];
      state.routes = full.routes || state.routes;
      state.latlong = full.latlong || state.latlong;
      state.latLongCache = null;
    }

    state.selected = flight;
    renderFlightList();
    updateMapForFlight(flight);
    renderInspector(Object.assign({}, flight, { analysis: [] }));

    const result = await run('analyzeFlightNotams', row);
    if (result && !result.error) {
      const idx = state.flights.findIndex(f => Number(f._rowId) === row);
      if (idx > -1) {
        // Merge: keep board display fields (QZ/DES etc), take analysis/risk/flags
        const base = state.flights[idx];
        const merged = Object.assign({}, base, {
          analysis: result.analysis || [],
          riskLevel: result.riskLevel || base.riskLevel,
          flags: result.flags || base.flags
        });
        state.flights[idx] = merged;
        if (state.selected && Number(state.selected._rowId) === row) state.selected = merged;
        renderFlightList();
        renderInspector(merged);
      }
    } else if (result && result.error) {
      addToast('Analysis error: ' + result.error);
    }
  }

  // Resolve active board rowIds from Flight_Ui.html (source of truth = Flight Board)
  function getActiveBoardRowIds() {
    try {
      if (Array.isArray(window.activeBoardRowIds) && window.activeBoardRowIds.length) return window.activeBoardRowIds.map(n => Number(n)).filter(n => !isNaN(n));
      // localStorage fallback (occ_active_board)
      const raw = localStorage.getItem('occ_active_board');
      if (raw) { const arr = JSON.parse(raw); if (Array.isArray(arr) && arr.length) return arr.map(n => Number(n)).filter(n => !isNaN(n)); }
      // window.allDbFlights filtered by board? last resort: all rowIdx on current board filter
      if (Array.isArray(window.allDbFlights) && window.allDbFlights.length && typeof window.getFilteredBoardFlights === 'function' && typeof window.flightFilter !== 'undefined') {
        try {
          const boardFlights = window.allDbFlights.filter(f => window.activeBoardRowIds && window.activeBoardRowIds.includes(f.rowIdx));
          if (boardFlights.length) return boardFlights.map(f => f.rowIdx);
        } catch(e) {}
      }
    } catch(e) {}
    return [];
  }

  async function loadFlights(force) {
    const box = document.getElementById('fir-flight-list');
    const requestId = ++state.flightLoadRequest;
    // Only blank the board when there is nothing to show — avoids the "reload" flash on tab switch
    if (force || !state.flightDataLoaded || !state.flights.length) {
      box.innerHTML = '<div class="fir-empty">Loading flights...</div>';
    }
    // Preserve the flight the user was inspecting across refreshes
    const prevRowId = state.selected ? Number(state.selected._rowId) : null;

    
    const boardIds = getActiveBoardRowIds();
    if (!boardIds.length) {
      console.log('[FIR] loadFlights: no flights on Flight Board (occ_active_board empty)');
      state.flights = [];
      state.selected = null;
      state.flightDataLoaded = true;
      renderFlightList();
      return;
    }
    console.log('[FIR] loadFlights -> active board rowIds:', boardIds);
    // Load only active board flights via getSelectedFlightsData (full fields + route/latlong)
    let data = await run('getSelectedFlightsData', boardIds, true);
    console.log('[FIR] getSelectedFlightsData payload:', data);
    if (!data || data.error) {
      console.error('[FIR] getSelectedFlightsData error:', data && data.error, data);
      data = await run('getSelectedFlightsData', boardIds, false);
      console.log('[FIR] getSelectedFlightsData(false) payload:', data);
    }
    if (requestId !== state.flightLoadRequest) return;
    // Normalize to same shape as before but filtered to board only
    if (data && !data.error && data.flights) {
      // seed route/latlong so map works immediately
      if (data.routes) state.routes = data.routes;
      if (data.latlong) state.latlong = data.latlong;
      state.latLongCache = null;
      // flights already filtered to boardIds + active by backend (firIsActiveFlightRecord)
      // keep minimal fields for board, but enrich with full fields for inspector/map
      data = { flights: data.flights.map(f => ({
        _rowId: f._rowId, QZ: String(f.QZ||f.FLIGHT||''), DOF: String(f.DOF||''),
        DEP: String(f.DEP||''), DES: String(f.DES||f.ARR||''), STD: String(f.STD||''), STA: String(f.STA||''), REG: String(f.REG||''),
        'ROUTE ID': f['ACTIVE_ROUTE_ID']||f['ROUTE_ID']||f['ACTIVE ROUTE ID']||f['ROUTE ID']||'', 'CRZ FL': f['CRZ FL']||f.ALT||'', riskLevel: f.riskLevel||f['RISK LEVEL']||'Clear'
      })) };
    }
    if (false) { // keep old getActiveFlightList path dead but visible for reference
      let _data = await run('getActiveFlightList', true);
      if (!_data || _data.error) _data = await run('getActiveFlightList', false);
    }
    if (data && !data.error && data.flights) {
      state.flights = data.flights;
      state.flightDataLoaded = true;
      
      // Log what we loaded for debugging
      console.log(`[FIR] Successfully loaded ${state.flights.length} flight(s) from board`);
      
      renderFlightList();
      if (state.flights.length) {
        const stillThere = prevRowId != null && state.flights.some(f => Number(f._rowId) === prevRowId);
        await selectFlight(stillThere ? prevRowId : Number(state.flights[0]._rowId));
      }
    } else {
      console.error('[FIR] Failed to load flights, full payload:', data);
      const hint = (data && data.error && String(data.error).includes('null')) ? '<br><span style="font-size:10px;opacity:.7;">Hint: Apps Script deployment is stale - redeploy as New Version, then hard-reload.</span>' : '';
      box.innerHTML = '<div class="fir-empty">Failed to load flights.' + (data && data.error ? '<br><span style="font-size:10px;opacity:.7;">' + esc(String(data.error)) + '</span>' : '<br><span style="font-size:10px;opacity:.7;">Invalid or empty response</span>') + hint + '</div>';
    }
  }

  async function analyzeAll() {
    try {
      // Force reload flight data before analysis
      await loadFlights();
      
      const analysisButton = document.getElementById('fir-analyze-all');
      if (analysisButton) {
        analysisButton.textContent = 'ANALYZING...';
        analysisButton.disabled = true;
      }
      
      addToast('Analyzing flights…');
      
      // Only analyze flights that are on the Flight Board
      const boardIds = getActiveBoardRowIds();
      const ids = (boardIds.length ? boardIds : state.flights.map(f => Number(f._rowId)));
      if (!ids.length) {
        addToast('No flights to analyze');
        return;
      }
      
      const results = await run('analyzeFlightList', ids);
      if (results && !results.error && Array.isArray(results)) {
        results.forEach(af => { const idx = state.flights.findIndex(f => Number(f._rowId) === Number(af._rowId)); if (idx > -1) { const base = state.flights[idx]; state.flights[idx] = Object.assign({}, base, { analysis: af.analysis || [], riskLevel: af.riskLevel || base.riskLevel, flags: af.flags || base.flags }); } });
        renderFlightList();
        if (state.selected) { const upd = state.flights.find(f => Number(f._rowId) === Number(state.selected._rowId)); if (upd) { state.selected = upd; renderInspector(upd); updateMapForFlight(upd); } }
        addToast('Analysis complete for ' + results.length + ' flight(s).');
        const persist = await run('persistAnalysisResults', results);
        if (persist && persist.error) addToast('Risk write-back: ' + persist.error);
        else if (persist && persist.success) addToast('Risk saved to sheet for ' + persist.count + ' flight(s).');
      } else {
        addToast('Analysis error: ' + ((results && results.error) || 'unknown'));
      }
    } catch (e) {
      console.error('[FIR] Analysis failed:', e);
      addToast('Analysis error: ' + String(e.message || e));
    } finally {
      // Restore button state
      const analysisButton = document.getElementById('fir-analyze-all');
      if (analysisButton) {
        setTimeout(() => {
          analysisButton.textContent = 'ANALYZE';
          analysisButton.disabled = false;
        }, 500);
      }
    }
  }

  function init(force) {
    if (state.initialized) {
      // don't auto-reload when switching pages — reuse cache, refetch only on explicit refresh
      if (force || !state.flightDataLoaded) loadFlights(force);
      else if (state.selected) renderFlightList();
      setTimeout(() => { if (state.map) state.map.invalidateSize(); }, 60);
      return;
    }
    state.initialized = true;
    if (typeof L !== 'undefined') { setTimeout(initMap, 0); }
    document.getElementById('fir-toggle-notams').addEventListener('click', toggleNotamLayer);
    const expBtn = document.getElementById('fir-expand-map');
    if (expBtn) expBtn.addEventListener('click', toggleMapExpand);
    // ESC / F hotkeys when FIR tab active
    document.addEventListener('keydown', (e) => {
      const firActive = document.getElementById('view-fir') && document.getElementById('view-fir').classList.contains('active');
      if (!firActive) return;
      if (e.key === 'Escape' && isMapExpanded()) { e.preventDefault(); closeMapExpand(); }
      if ((e.key === 'f' || e.key === 'F') && !e.ctrlKey && !e.metaKey && e.target && !/INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) {
        e.preventDefault(); toggleMapExpand();
      }
    });
    // Keep button in sync when user exits via browser chrome ESC
    document.addEventListener('fullscreenchange', () => {
      const wrap = document.getElementById('fir-map-wrap');
      if (!document.fullscreenElement && wrap.classList.contains('is-fullscreen') && !wrap.matches(':fullscreen')) {
        // keep fallback open until explicit close — don't auto-clear
      }
      if (!document.fullscreenElement && !document.webkitFullscreenElement) syncExpandBtn();
      setTimeout(() => { if(state.map) state.map.invalidateSize(); }, 60);
      setTimeout(() => { if(state.map) state.map.invalidateSize(); }, 250);
    });
    document.addEventListener('webkitfullscreenchange', () => {
      if (!document.webkitFullscreenElement) syncExpandBtn();
      setTimeout(() => { if(state.map) state.map.invalidateSize(); }, 60);
    });
    document.getElementById('fir-analyze-all').addEventListener('click', analyzeAll);
    
    // Manual refresh remains available as an explicit fallback.
    const refreshBtn = document.getElementById('fir-refresh-flights');
    if (refreshBtn) {
      refreshBtn.addEventListener('click', async () => {
        console.log('[FIR] User triggered manual refresh');
        refreshBtn.disabled = true;
        try {
          await Promise.all([loadFlights(true), loadActiveNotams()]);
          renderHazardChips();
          renderHazardList();
          addToast('Flights and FIR NOTAMs refreshed');
        } catch (e) {
          console.error('[FIR] Refresh failed:', e);
          addToast('Refresh failed: ' + String(e.message || e));
        } finally {
          refreshBtn.disabled = false;
        }
      });
    }
    
    const hzSearch = document.getElementById('fir-hazard-search');
    if (hzSearch) hzSearch.addEventListener('input', (e) => { state.hzQuery = e.target.value; renderHazardChips(); renderHazardList(); });
    
    window.addEventListener('occ:boardChanged', () => {
      const view = document.getElementById('view-fir');
      if (view && view.classList.contains('active')) loadFlights();
    });
    
    window.addEventListener('occ:firNotamsChanged', async () => {
      await loadActiveNotams();
      renderHazardChips();
      renderHazardList();
      if (state.selected) await selectFlight(state.selected._rowId);
    });
    loadActiveNotams();
    loadFlights();
    // The view-section becomes active before this runs, but Leaflet may have
    // measured the map while it was hidden; refresh size once visible.
    setTimeout(() => { if (state.map) state.map.invalidateSize(); }, 60);
  }

  window.initFirDashboard = init;

  /**
   * Focus the FIR map on a specific NOTAM (called from the FIR NOTAM Results tab).
   * Switches to the FIR view, ensures the map + NOTAM layer are ready, then
   * centers on the NOTAM location and opens its popup.
   * @param {Object} notam  { Location, 'NOTAM #', ... } from the FIR editor.
   */
  window.firFocusNotamOnMap = async function (notam) {
    try {
      const wasFirActive = document.getElementById('view-fir') && document.getElementById('view-fir').classList.contains('active');
      if (!wasFirActive && typeof window.switchTab === 'function') window.switchTab('fir');
      if (typeof L === 'undefined') return;
      if (!state.map) { try { initMap(); } catch (e) {} }
      if (!state.map) return;
      if (!state.showNotams) {
        state.showNotams = true;
        const btn = document.getElementById('fir-toggle-notams');
        if (btn) btn.classList.add('active');
      }
      // Ensure NOTAM data is loaded.
      if (!state.notams || !state.notams.length) {
        try { await loadActiveNotams(); } catch (e) {}
      }
      const loc = String(notam && (notam.Location || notam.location) || '').trim().toUpperCase();
      const num = String(notam && (notam['NOTAM #'] || notam.number) || '').trim().toUpperCase();
      const match = (state.notams || []).find(function (n) {
        const nl = String(n.location || n.Location || '').trim().toUpperCase();
        const nn = String(n.number || n['NOTAM #'] || '').trim().toUpperCase();
        return nl === loc && nn === num;
      }) || (state.notams || []).find(function (n) {
        return String(n.location || n.Location || '').trim().toUpperCase() === loc;
      });
      if (!match) {
        // Fallback: center on the location code using the shared fallback coords.
        const fb = window.firFallbackCoords && window.firFallbackCoords[loc];
        if (fb) state.map.setView([fb[1], fb[0]], 7);
        return;
      }
      const ll = getNotamLatLon(match);
      if (!ll) return;
      const lat = ll[0], lon = ll[1];
      const props = {
        location: match.location != null ? match.location : match.Location,
        number: match.number != null ? match.number : match['NOTAM #'],
        cls: match.cls || null,
        active: match.active !== false,
        risk: match.risk || 'LOW',
        text: match.text || match['NOTAM Text'] || '',
        effectiveDate: match.effectiveDate || null,
        expirationDate: match.expirationDate || null,
        center: (Array.isArray(match.center) && match.center.length === 2) ? match.center : [lon, lat],
        radiusNm: match.radiusNm || null,
        polygon: normalizePolygon(match.polygon)
      };
      clearNotamShape();
      drawNotamShape(props);
      state.map.setView([lat, lon], 8);
      openNotamPopup(props, lat, lon);
      setTimeout(() => { if (state.map) state.map.invalidateSize(); }, 120);
    } catch (e) {
      console.error('firFocusNotamOnMap error:', e);
    }
  };
})();
</script>
