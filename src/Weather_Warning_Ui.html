<!-- 
  Weather_Warning_Ui.html
  Vanilla JS version for integration into DISPATCH IO.
-->
<div id="view-weather" class="view-section">
  <style>
    /* fonts loaded via Index.html preconnect */
    /* a11y: local focus ring (global lives in Index.html shell) */
    #view-weather button:focus-visible, #view-weather [role="button"]:focus-visible, #view-weather select:focus-visible, #view-weather input:focus-visible, #view-weather a:focus-visible { outline:3px solid var(--accent-primary); outline-offset:2px; }
    .weather-grid {
      display: flex;
      flex-direction: column;
      gap: 16px;
      margin-top: 24px;
    }
    .weather-card {
      background: var(--bg-panel);
      border: 1px solid var(--border-light);
      border-radius: var(--radius-lg);
      padding: 0;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: border-color 160ms ease-out, box-shadow 160ms ease-out, transform 160ms ease-out, background 160ms ease-out;
    }
    @media (hover: hover) and (pointer: fine) {
      .weather-card:hover {
        background: var(--bg-panel-raised);
        border-color: var(--accent-primary);
        box-shadow: 0 8px 24px rgba(200, 16, 46, 0.14);
      }
    }
    
    /* Fase 2: header + 3-lane (ganti grid 5-kolom linier yang sesak) */
    .weather-card-main {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      align-items: stretch;
      padding: 0;
    }
    .wx-card-head {
      display: flex;
      align-items: baseline;
      gap: 12px;
      flex-wrap: wrap;
      padding: 14px 20px;
      border-bottom: 1px solid var(--border-subtle);
      grid-column: 1 / -1;
    }
    .wx-head-right { margin-left: auto; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .wx-pill {
      font-size: 12px; font-weight: 800; letter-spacing: 0.06em;
      padding: 3px 10px; border-radius: 999px; border: 1px solid transparent; white-space: nowrap;
    }
    .wx-pill-danger { color: var(--status-critical); border-color: var(--status-critical); background: var(--status-critical-bg); }
    .wx-pill-warning { color: var(--status-warning); border-color: var(--status-warning); background: var(--status-warning-bg); }
    .wx-pill-clear { color: var(--status-safe); border-color: var(--status-safe); background: var(--status-safe-bg); }
    .wx-pill-nodata { color: var(--text-muted); border-color: var(--border-medium); background: var(--bg-panel-sunken); border-style: dashed; }

    .flight-info-group {
      display: flex;
      align-items: baseline;
      gap: 12px;
      flex-wrap: wrap;
      min-width: 0;
    }
    .weather-flight-no {
      font-weight: 900;
      font-size: 24px;
      color: var(--text-primary);
      letter-spacing: -0.02em;
    }
    .weather-route {
      font-size: 12px;
      color: var(--text-secondary);
      font-weight: 800;
      letter-spacing: 0.04em;
      font-family: var(--font-mono);
    }

    .weather-point {
      padding: 14px 18px;
      border-radius: 0;
      display: flex;
      flex-direction: column;
      gap: 4px;
      margin: 0;
      min-width: 0;
      border-left: 4px solid var(--border-light);
    }
    .weather-point + .weather-point { border-left: 1px solid var(--border-subtle); }
    .weather-point.status-danger { border-left: 4px solid var(--status-critical); }
    .weather-point.status-warning { border-left: 4px solid var(--status-warning); }
    .weather-point.status-clear { border-left: 4px solid var(--status-safe); }
    @media (max-width: 900px) {
      .weather-card-main { grid-template-columns: minmax(0, 1fr); }
      .weather-point + .weather-point { border-top: 1px solid var(--border-subtle); }
    }

    .point-label {
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      opacity: 0.7;
    }
    .point-val {
      font-family: var(--font-mono);
      font-weight: 900;
      font-size: 18px;
    }
    .point-status {
      font-size: 10px;
      font-weight: 900;
      display: flex;
      align-items: center;
      gap: 6px;
      text-transform: uppercase;
    }

    /* Modern Status Colors */
    .status-clear { background: var(--status-safe-bg); color: var(--status-safe); border: 1px solid var(--status-safe); border-left: 3px solid var(--status-safe); }
    .status-warning { background: var(--status-warning-bg); color: var(--status-warning); border: 1px solid var(--status-warning); border-left: 3px solid var(--status-warning); }
    .status-danger { background: var(--status-critical-bg); color: var(--status-critical); border: 1px solid var(--status-critical); border-left: 3px solid var(--status-critical); }
    .status-nodata { background: var(--bg-panel-sunken); color: var(--text-muted); border: 1px dashed var(--border-medium); border-left: 3px solid var(--border-medium); }

    .taf-details-btn {
      background: var(--text-primary);
      color: var(--bg-panel);
      border: none;
      padding: 10px 18px;
      min-height: 36px;
      position: relative;
      border-radius: var(--radius-sm);
      font-weight: 900;
      font-size: 12px;
      cursor: pointer;
      text-transform: uppercase;
      transition: transform 120ms ease-out, background 160ms ease-out, color 160ms ease-out;
    }
    .taf-details-btn::after { content: ''; position: absolute; inset: -6px; }
    .taf-details-btn:hover {
      background: var(--accent-primary);
      color: white;
    }
    .taf-details-btn:active { transform: scale(0.97); }

    /* Fase 3: accordion halus via grid-rows (pengganti display:none instan) */
    .wx-drawer-wrap {
      display: grid;
      grid-template-rows: 0fr;
      opacity: 0.35;
      visibility: hidden;
      transition: grid-template-rows 220ms cubic-bezier(0.23, 1, 0.32, 1), opacity 200ms ease-out, visibility 200ms ease-out;
    }
    .wx-drawer-wrap.open { grid-template-rows: 1fr; opacity: 1; visibility: visible; }
    .wx-drawer-wrap:not(.open) { pointer-events: none; }
    .wx-drawer-inner { overflow: hidden; min-height: 0; }
    .taf-drawer {
      background: var(--bg-panel-sunken);
      border-top: 1px solid var(--border-subtle);
      padding: 16px 24px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
    }
    /* Fase 3: entrance stagger + skeleton shimmer */
    @keyframes wx-rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes wx-shimmer { to { background-position: -200% 0; } }
    @keyframes wx-fade { from { opacity: 0; } to { opacity: 1; } }
    .weather-card.animate-in { animation: wx-rise 320ms cubic-bezier(0.23, 1, 0.32, 1) both; }
    .wx-skel-card {
      background: var(--bg-panel);
      border: 1px solid var(--border-light);
      border-radius: var(--radius-lg);
      padding: 16px 20px;
    }
    .wx-skel-bar {
      height: 12px; border-radius: 6px;
      background: linear-gradient(90deg, var(--bg-panel-sunken) 25%, var(--border-light) 50%, var(--bg-panel-sunken) 75%);
      background-size: 200% 100%;
      animation: wx-shimmer 1.2s linear infinite;
    }
    .wx-ai-result { transition: opacity 200ms ease-out; }
    #wx-manual-body { animation: wx-fade 200ms ease-out; }

    .taf-sub-block {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .taf-sub-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 10px;
      font-weight: 900;
      color: var(--accent-primary);
      letter-spacing: 0.1em;
    }

    .taf-text {
      font-family: var(--font-mono);
      font-size: 12px;
      color: var(--text-primary);
      background: var(--bg-panel-sunken);
      padding: 10px;
      border-radius: var(--radius-sm);
      line-height: 1.5;
      min-height: 60px;
      border-left: 2px solid var(--border-light);
    }
    .taf-text mark {
      background: #FDE68A;
      color: #1A1206;
      padding: 0 3px;
      border-radius: 3px;
      border: 1px solid transparent;
    }
    /* Fase 1: chip pasal diwarnai mengikuti severity lane induk */
    .weather-point.status-danger div span,
    .status-danger .wx-ref-chip { border-color: rgba(255, 93, 93, 0.55) !important; color: var(--status-critical) !important; }
    .weather-point.status-warning div span,
    .status-warning .wx-ref-chip { border-color: rgba(255, 178, 36, 0.55) !important; color: var(--status-warning) !important; }
    .wx-trigger {
      font-family: var(--font-mono);
      font-size: 12px;
      color: var(--text-primary);
      margin-top: 6px;
      overflow-wrap: anywhere;
    }
    .wx-ai-row {
      display: grid;
      grid-template-columns: 118px minmax(0, 1fr) auto;
      gap: 10px;
      align-items: baseline;
      padding: 7px 0;
      border-top: 1px dashed var(--border-light);
    }
    .wx-ai-row:first-child { border-top: 0; }
    .wx-ai-leg { font-size: 12px; font-weight: 800; letter-spacing: 0.06em; }
    .wx-ai-reason { font-family: var(--font-mono); font-size: 12px; overflow-wrap: anywhere; min-width: 0; }
    .wx-ai-chapter { font-size: 11px; color: var(--text-muted); text-align: right; }
    @media (max-width: 720px) {
      .wx-ai-row { grid-template-columns: minmax(0, 1fr); gap: 2px; }
      .wx-ai-chapter { text-align: left; }
      .taf-drawer { grid-template-columns: minmax(0, 1fr); }
    }
    /* WX theme: ikut shell (Titanium Light / Ethereal Dark) — tanpa override hardcoded.
       Kartu/drawer/panel memakai var(--bg-panel) dkk dari Index.html sehingga
       toggle #theme-toggle otomatis berlaku. Hanya tweak per-tema yang butuh
       nilai eksplisit didefinisikan via [data-theme="dark"] di bawah. */
    #view-weather .weather-card { box-shadow: var(--shadow-soft); }
    #view-weather .weather-card:hover { border-color: var(--accent-primary); box-shadow: var(--shadow-lift); }
    #view-weather .taf-details-btn:disabled { opacity: 0.55; cursor: wait; }
    #view-weather .taf-text mark { background: #FEF3C7; color: #92400E; border: 1px solid #F59E0B; }
    #view-weather .wx-trigger { color: var(--text-secondary); }
    #view-weather .wx-ai-chapter { color: var(--text-secondary); }
    #view-weather .wx-ai-action { color: var(--accent-primary); font-weight: 700; }
    #view-weather select { background: var(--bg-panel-sunken); color: var(--text-primary); min-height: 36px; }
    /* AI REVIEW v2.1 — badge semantik, ganti semua-merah. Override render saja, engine tetap.
       Semua var(--*) Titanium jadi otomatis ikut light (:root) + dark ([data-theme="dark"]). */
    #view-weather .wx-ai-result { display:grid; gap:0; }
    #view-weather .wx-ai-head { display:flex; align-items:center; justify-content:space-between; gap:8px; flex-wrap:wrap;
      font-family:Consolas,monospace; font-size:11px; font-weight:700; line-height:1; margin:0 12px 6px;
      color:var(--text-primary); }
    #view-weather .wx-ai-model-badge { display:inline-flex; align-items:center; gap:6px;
      font-size:11px; font-weight:800; letter-spacing:.06em;
      border:1px solid var(--border-light); border-radius:999px; padding:2px 10px;
      background:var(--bg-panel-sunken); color:var(--text-primary); white-space:nowrap; }
    #view-weather .wx-ai-model-badge .vendor { color:var(--accent-primary); }
    #view-weather .wx-ai-row { display:grid; grid-template-columns:150px minmax(0,1fr) 230px; gap:0;
      border-top:1px solid var(--border-subtle); border-left:4px solid var(--border-light);
      padding:0; align-items:stretch; }
    #view-weather .wx-ai-row.st-danger { border-left-color:var(--status-critical); }
    #view-weather .wx-ai-row.st-warning { border-left-color:var(--status-warning); }
    #view-weather .wx-ai-row.st-ok { border-left-color:var(--status-safe); }
    #view-weather .wx-ai-leg { padding:10px 12px; display:flex; flex-direction:column; gap:4px; align-items:flex-start; }
    #view-weather .wx-ai-badge { display:inline-flex; align-items:center; gap:6px;
      font-size:11px; font-weight:900; letter-spacing:.06em; white-space:nowrap;
      padding:3px 10px; border-radius:999px; border:1px solid transparent; }
    #view-weather .wx-ai-badge svg { width:11px; height:11px; flex:none; }
    #view-weather .b-danger { color:var(--status-critical); border-color:var(--status-critical); background:var(--status-critical-bg); }
    #view-weather .b-warning { color:var(--status-warning); border-color:var(--status-warning); background:var(--status-warning-bg); }
    #view-weather .b-ok { color:var(--status-safe); border-color:var(--status-safe); background:var(--status-safe-bg); }
    #view-weather .b-nodata { color:var(--text-muted); border-color:var(--border-medium); background:var(--bg-panel-sunken); border-style:dashed; }
    #view-weather .wx-ai-phase { font-size:10px; font-weight:800; letter-spacing:.08em; color:var(--text-muted); }
    #view-weather .wx-ai-reason { padding:10px 14px; min-width:0;
      border-left:1px solid var(--border-subtle); border-right:1px solid var(--border-subtle);
      font-family:var(--font-mono); font-size:12px; color:var(--text-primary); overflow-wrap:anywhere; }
    #view-weather .wx-ai-action { display:block; margin-top:3px; font-family:var(--font-ui); font-size:12px; font-weight:700; }
    #view-weather .wx-ai-action::before { content:"→ "; font-weight:800; }
    #view-weather .st-danger .wx-ai-action { color:var(--status-critical); }
    #view-weather .st-warning .wx-ai-action { color:var(--status-warning); }
    #view-weather .st-ok .wx-ai-action { color:var(--status-safe); }
    #view-weather .wx-ai-chapter { padding:10px 12px; display:flex; align-items:flex-start; justify-content:flex-end; }
    #view-weather .wx-ai-src { display:inline-flex; align-items:center; gap:6px; font-size:11px; font-weight:700; color:var(--text-muted);
      border:1px solid var(--border-light); border-radius:999px; padding:8px 12px; max-width:100%;
      background:transparent; font-family:inherit; cursor:pointer; min-height:36px; position:relative; }
    #view-weather .wx-ai-src::after { content:''; position:absolute; inset:-4px; }
    #view-weather .wx-ai-src:hover { border-color:var(--accent-primary); color:var(--accent-primary); }
    #view-weather .wx-ai-src svg { width:11px; height:11px; flex:none; }
    #view-weather .wx-ai-src span { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    /* v2.2: drawer select per kartu (shortcut ke master #wx-ai-model). */
    #view-weather .wx-ai-head select.wx-ai-model-sel { font-family:Consolas,monospace; font-size:11px; font-weight:700;
      color:var(--text-primary); background:var(--bg-panel); border:1px solid var(--border-light); border-radius:6px;
      padding:8px 10px; min-height:36px; max-width:240px; cursor:pointer; }
    #view-weather .wx-ai-head select.wx-ai-model-sel:hover { border-color:var(--accent-primary); }
    #view-weather .wx-ai-head .wxv-cap { font-size:10px; font-weight:800; letter-spacing:.06em;
      color:var(--text-muted); white-space:nowrap; }
    @media (max-width:720px) {
      #view-weather .wx-ai-row { grid-template-columns:minmax(0,1fr); }
      #view-weather .wx-ai-reason { border-left:none; border-right:none; border-top:1px solid var(--border-subtle); border-bottom:1px solid var(--border-subtle); }
      #view-weather .wx-ai-chapter { justify-content:flex-start; }
      #view-weather .wx-ai-src span { white-space:normal; }
    }
    /* Night-ops tweak: hanya saat shell dark — mark lembut, tombol outline cyan, glow gelap. */
    [data-theme="dark"] #view-weather .weather-card { box-shadow: 0 0 0 1px #16294A, 0 12px 32px rgba(0, 0, 0, 0.45); }
    [data-theme="dark"] #view-weather .weather-card:hover { border-color: var(--accent-primary); box-shadow: 0 0 0 1px var(--accent-primary), 0 12px 32px rgba(0, 0, 0, 0.5); }
    [data-theme="dark"] #view-weather .taf-details-btn { background: transparent; border: 1px solid var(--accent-primary); color: var(--accent-primary); }
    [data-theme="dark"] #view-weather .taf-details-btn:hover { background: var(--accent-primary); color: #04121F; }
    [data-theme="dark"] #view-weather .taf-text mark { background: rgba(255, 178, 36, 0.25); color: #FFD480; border: 1px solid rgba(255, 178, 36, 0.4); }
    /* Fase 1: hormati pengguna yang mengurangi gerak + cegah hover lengket di sentuh */
    @media (prefers-reduced-motion: reduce) {
      #view-weather .weather-card, #view-weather .taf-details-btn,
      #view-weather .wx-drawer-wrap, #view-weather .wx-skel-bar,
      #view-weather .weather-card.animate-in { transition: none; animation: none; opacity: 1; transform: none; }
    }
  </style>

  <div style="display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 24px;">
    <div>
      <div style="color: var(--accent-primary); font-weight: 900; font-size: 32px; letter-spacing: -0.02em;">WEATHER <span style="color: var(--text-primary); opacity: 0.9;">WARNING</span></div>
      <div id="weather-last-update" class="header-sub" role="status" aria-live="polite">ACTIVE FLIGHT WATCH (UTC OPERATIONS) • LAST UPDATE: --:--:-- Z</div>
    </div>
    <div class="action-btn-group">
      <button class="control-btn btn-solid-primary" style="padding: 10px 20px;" onclick="window.initWeatherDashboard(true)"><svg class="ic ic-sm"><use href="#i-sync"/></svg> REFRESH ENGINE</button>
    </div>
  </div>

  <div class="kpi-grid">
    <div class="kpi-card accent"><span class="kpi-label">Flights Watched</span><span class="kpi-val" id="wx-kpi-total">0</span><span class="kpi-sub">active on board</span></div>
    <div class="kpi-card crit"><span class="kpi-label">Restricted</span><span class="kpi-val" id="wx-kpi-danger">0</span><span class="kpi-sub">visibility / severe</span></div>
    <div class="kpi-card warn"><span class="kpi-label">Monitor</span><span class="kpi-val" id="wx-kpi-warn">0</span><span class="kpi-sub">ts / reduced</span></div>
    <div class="kpi-card safe"><span class="kpi-label">Operational</span><span class="kpi-val" id="wx-kpi-clear">0</span><span class="kpi-sub">no impact</span></div>
    <div class="kpi-card"><span class="kpi-label">No TAF</span><span class="kpi-val" id="wx-kpi-nodata">0</span><span class="kpi-sub">unverified — check source</span></div>
  </div>

  <div id="wx-ai-bar" style="margin:12px 0;display:flex;align-items:center;gap:8px;font-size:12px;">
    <label for="wx-ai-model" style="font-weight:800;opacity:.75;">AI MODEL</label>
    <select id="wx-ai-model" style="font-size:12px;padding:8px 12px;border-radius:8px;border:1px solid var(--border-light);">
      <option value="">Auto</option>
      <option value='{"provider":"gemini","model":"gemini-3.5-flash-lite"}'>Gemini · 3.5-flash-lite</option>
      <option value='{"provider":"custom","model":"kl/deepseek-v3.2"}'>CIZ-AI · deepseek-v3.2</option>
      <option value='{"provider":"custom","model":"kl/hy3"}'>CIZ-AI · hy3</option>
      <option value='{"provider":"custom","model":"kl/gemini-3.8-flash"}'>CIZ-AI · gemini-3.8-flash</option>
      <option value='{"provider":"custom","model":"kl/gemini-3.1-pro"}'>CIZ-AI · gemini-3.1-pro</option>
    </select>
  </div>
  <div id="weather-container" class="weather-grid">
    <div style="grid-column: 1/-1; text-align: center; padding: 40px; color: var(--text-muted);">
      INITIALIZING WEATHER ENGINE...
    </div>
  </div>

  <div id="wx-manual-panel" data-open="0" style="margin:12px 0;padding:12px 16px;border:1px solid var(--border-light);border-radius:12px;font-size:12px;color:var(--text-primary);">
    <span style="opacity:.65">[ REFERENCE: loading... ]</span>
  </div>

  <script>
  (function() {
  // Normalisasi waktu HHMM polos (DB legacy) maupun HH:MM → jam 2 digit + label HH:MM.
  // ponytail: split(':')[0] lama PECAH di '1230' → staH='1230' → parseInt%24=6, alt window ngaco.
  function wxHourParts(v) {
    const d = String(v || '').replace(/[^0-9]/g, '').padStart(4, '0');
    return { hh: d.slice(0, 2), label: d.slice(0, 2) + ':' + d.slice(2, 4) };
  }
  // TAF timestamp mentah → label pendek yang bisa dibaca: ISO penuh "2026-09-11T17:00:00.000Z"
  // menjadi "17:00" bila hari ini (UTC), atau "11 17:00" bila beda tanggal.
  function wxTafTimeLabel(raw) {
    if (!raw) return '—';
    const d = new Date(raw);
    if (isNaN(d.getTime())) return String(raw);
    const hh = String(d.getUTCHours()).padStart(2, '0') + ':' + String(d.getUTCMinutes()).padStart(2, '0');
    const now = new Date();
    if (d.getUTCFullYear() === now.getUTCFullYear() && d.getUTCMonth() === now.getUTCMonth() && d.getUTCDate() === now.getUTCDate()) return hh;
    return String(d.getUTCDate()).padStart(2, '0') + ' ' + hh;
  }
      window.weatherDataCache = null;
      window.weatherLastUpdate = null;
      window.wxRules = null;   // {rules,useRules,source} from getWxRules()
      window.wxManual = null;  // {sections,source} from getWxManualExcerpt()
      window.wxRefs = [];      // CHAPTER_REFs collected by the last evaluateWeather call
      window.wxAiResults = {}; // rowIdx → AI payload (survives tab switches + re-renders)
      window.wxAiPending = {}; // rowIdx → true while a request is in flight

      function evaluateWeather(icao, startHour, rawTaf) {
        window.wxTriggerBlock = '';
        // Never fabricate a verdict when TAF is unavailable — report NO DATA.
        if (!rawTaf || String(rawTaf).includes("No TAF data")) {
          return 'NO_DATA';
        }

        // 1. Prepare Text
        let taf = rawTaf.toUpperCase();
        const icaoPattern = new RegExp('\\b' + icao.toUpperCase() + '\\b', 'g');
        taf = taf.replace('TAF', '').replace(icaoPattern, '');

        // Helper: Get Visibility (4 digits)
        const getVis = (txt) => {
          // Filter out validity periods (e.g. 06/12) and timestamps (e.g. 0500Z) 
          // to avoid false positives for visibility check
          const clean = txt.replace(/\b\d{4}\/\d{4}\b/g, '').replace(/\b\d{6}Z\b/g, '');
          const match = clean.match(/\b(\d{4})\b/);
          return match ? parseInt(match[1]) : 9999;
        };

        // WX S2: server-driven rules. Active only when USE_WX_RULES is on AND
        // WX_RULES is non-empty; otherwise legacy regex below (verbatim).
        const wxActiveRules = () => {
          const w = window.wxRules;
          return (w && w.useRules && w.rules && w.rules.length) ? w.rules : null;
        };
        const wxRuleFires = (rule, txt, vis) => {
          let re; try { re = new RegExp(rule.tokenRegex); } catch (e) { return false; }
          if (!re.test(txt)) return false;
          if (rule.visMin !== null && rule.visMin !== undefined && vis > rule.visMin) return false;
          return true;
        };
        // Classify one uppercased block. Returns {status, refs} on the rules path,
        // null when legacy fallback applies. Refs feed the CHAPTER_REF chips.
        const wxMatchBlock = (txt) => {
          const rules = wxActiveRules();
          if (!rules) return null;
          const vis = getVis(txt);
          let warned = false;
          const refs = [];
          for (const r of rules) {
            if (wxRuleFires(r, txt, vis)) {
              if (r.type === 'DANGER') return { status: 'DANGER', refs: r.chapterRef ? [r.chapterRef] : [] };
              if (r.type === 'WARNING') {
                warned = true;
                if (r.chapterRef && !refs.includes(r.chapterRef)) refs.push(r.chapterRef);
              }
            }
          }
          return warned ? { status: 'WARNING', refs } : { status: 'CLEAR', refs: [] };
        };
        // Categorization Rules (legacy fallback preserved verbatim)
        const wxLegacyDanger = (txt) => {
          if (getVis(txt) <= 3000) return true; // Visibility Restricted
          return /FG|SQ|FC|\+RA/.test(txt);    // Severe Weather
        };
        const wxLegacyWarning = (txt) => /TS|RA|DZ|SH|HZ|BR|VCTS/.test(txt); // TSRA moved to Warning
        const isDanger = (txt) => {
          const m = wxMatchBlock(txt);
          if (m) return m.status === 'DANGER';
          return wxLegacyDanger(txt);
        };
        const isWarning = (txt) => {
          const m = wxMatchBlock(txt);
          if (m) return m.status === 'WARNING';
          return wxLegacyWarning(txt);
        };

        // 2. Split into blocks (S2: rule verdicts carry CHAPTER_REFs; legacy fallback keeps refs empty)
        const classify = (txt) => {
          const m = wxMatchBlock(txt);
          if (m) return m;
          if (wxLegacyDanger(txt)) return { status: 'DANGER', refs: [] };
          if (wxLegacyWarning(txt)) return { status: 'WARNING', refs: [] };
          return { status: 'CLEAR', refs: [] };
        };
        const mergeRefs = (dst, src) => { (src || []).forEach(r => { if (r && !dst.includes(r)) dst.push(r); }); return dst; };
        const parts = taf.split(/\s+(?=TEMPO|BECMG|FM|PROB|INTER)/);
        window.wxRefs = [];
        const baseM = classify(parts[0]);
        let baseStatus = baseM.status;
        mergeRefs(window.wxRefs, baseM.refs);
        if (baseM.status === 'DANGER' || baseM.status === 'WARNING') window.wxTriggerBlock = parts[0];

        const flightHour = parseInt(startHour);
        let worstStatus = baseStatus;

        // 3. Analyze change blocks
        for (let i = 1; i < parts.length; i++) {
          const block = parts[i];
          const timeMatch = block.match(/(\d{2})(\d{2})\/(\d{2})(\d{2})/);
          
          let isActive = false;
          let isPermanent = block.includes('BECMG') || block.includes('FM');

          if (timeMatch) {
            const startH = parseInt(timeMatch[2]);
            const endH = parseInt(timeMatch[4]);
            
            if (startH <= endH) {
              // Inclusive window for safety (e.g. 08/12 covers hour 12)
              if (flightHour >= startH && flightHour <= endH) isActive = true;
              // Persistence for BECMG/FM
              if (isPermanent && flightHour > endH) isActive = true;
            } else {
              // Over midnight
              if (flightHour >= startH || flightHour <= endH) isActive = true;
              if (isPermanent && flightHour > endH && flightHour < startH) isActive = true;
            }
          } else if (block.includes('FM')) {
            const fmMatch = block.match(/FM(\d{2})(\d{2})(\d{2})/);
            if (fmMatch && flightHour >= parseInt(fmMatch[2])) isActive = true;
          }

          if (isActive) {
            const cm = classify(block);
            if (cm.status === 'DANGER') { mergeRefs(window.wxRefs, cm.refs); if (!window.wxTriggerBlock) window.wxTriggerBlock = block; return 'DANGER'; } // Exit early if Restricted
            if (cm.status === 'WARNING') { worstStatus = 'WARNING'; mergeRefs(window.wxRefs, cm.refs); if (!window.wxTriggerBlock) window.wxTriggerBlock = block; }
          }
        }

        return worstStatus;
      }

      function getStatusClass(status) {

       window.wxAiCached = function(rowIdx) {

      window.wxAiReview = function(btn, rowIdx) {

         const f = (window.weatherDataCache || []).find(x => x.rowIdx === rowIdx);
         if (!f) return; // unknown flight
         if (window.wxAiPending[rowIdx]) {

        if (willOpen) { body.removeAttribute('hidden'); body.style.display = 'block'; }
        else { body.setAttribute('hidden', ''); body.style.display = 'none'; }
        if (btn) btn.setAttribute('aria-expanded', String(willOpen));
        if (arrow) arrow.innerText = willOpen ? '▾' : '▸';
      };
      function renderWxManual() {
        const panel = document.getElementById('wx-manual-panel');
        if (!panel) return;
        const e3 = window.escapeHtml;
        const m = window.wxManual;
        const head = (sub) => '<button type="button" class="wx-manual-toggle" style="display:flex;align-items:center;gap:8px;cursor:pointer;font-size:12px;font-weight:900;letter-spacing:.08em;background:none;border:0;padding:6px 0;color:inherit;font:inherit;position:relative;" aria-expanded="false" aria-controls="wx-manual-body" onclick="window.wxToggleManual()">WEATHER REFERENCE (STATIC)' + sub + ' <span id="wx-manual-arrow" aria-hidden="true">▸</span></button>';
        if (!m || !m.sections || !m.sections.length) {
          panel.innerHTML = head('') + '<div id="wx-manual-body" hidden style="display:none;margin-top:8px;"><span style="opacity:.65">[ WX_MANUAL_EXCERPT not configured ]</span></div>';
          return;
        }
        panel.innerHTML = head(' <span style="opacity:.6;">· ' + m.sections.length + ' bagian</span>')
          + '<div id="wx-manual-body" hidden style="display:none;margin-top:8px;">' + m.sections.map(s => {
            const doc = s.doc || '';
            return '<div style="margin-bottom:6px;"><div style="font-size:11px;font-weight:800;opacity:.8;">' + (e3 ? e3((doc ? '[' + doc + '] ' : '') + s.section) : ((doc ? '[' + doc + '] ' : '') + s.section)) + '</div>' +
            '<ul style="margin:2px 0 0 16px;padding:0;font-size:12px;">' +
            s.items.map(it => {
              const tx = (typeof it === 'string') ? it : it.text; // tolerate pre-SOURCE cache
              const sc = (it && it.source) || '';
              const ac = (it && it.action) || '';
              return '<li>' + (e3 ? e3(tx) : tx) + (sc && sc !== doc ? ' <span style="opacity:.6;">[' + (e3 ? e3(sc) : sc) + ']</span>' : '') + (ac ? '<div style="font-size:11px;font-weight:700;">→ ' + (e3 ? e3(ac) : ac) + '</div>' : '') + '</li>';
            }).join('') + '</ul></div>';
          }).join('') + '</div>';
      }

      window.initWeatherDashboard = function(forceRefresh = false) {
        const container = document.getElementById('weather-container');
        if (window.wxAiCatalogLoad) window.wxAiCatalogLoad(forceRefresh);
        if (window.weatherDataCache && !forceRefresh) {
          renderWeather(window.weatherDataCache);
          return;
        }
        container.innerHTML = [0, 1, 2].map(() => '<div class="wx-skel-card"><div class="wx-skel-bar" style="width:38%;margin-bottom:10px"></div><div class="wx-skel-bar" style="width:92%;margin-bottom:8px"></div><div class="wx-skel-bar" style="width:78%"></div></div>').join('');
        window.loadWxConfig(forceRefresh, function() {
        if (typeof google === 'undefined' || !google.script || !google.script.run) {
          window.wxShowBoardError('BRIDGE UNAVAILABLE (preview without google.script.run) — open via Index shell or click RETRY.');
          return;
        }
        let settled = false;
        const boardTo = setTimeout(function() {
          if (settled) return;
          settled = true;
          window.wxShowBoardError('BOARD TIMEOUT (20s, getActiveFlightDataForWarning did not respond) — click RETRY LOAD.');
        }, 20000);
        google.script.run
          .withSuccessHandler(function(json) {
            if (settled) return;
            settled = true; clearTimeout(boardTo);
            let flights;
            try { flights = JSON.parse(json); }
            catch (e) { window.wxShowBoardError('BOARD FAILED (invalid server response) — click RETRY LOAD.'); return; }
            if (flights.error) {
              const safeWxErr = window.escapeHtml ? window.escapeHtml(flights.error) : 'Unable to load flight data';
              container.innerHTML = `<div role="alert" style="text-align: center; padding: 40px; color: var(--status-critical);">${safeWxErr}<br><button class="taf-details-btn" style="margin-top:12px;" onclick="window.initWeatherDashboard(true)">RETRY LOAD</button></div>`;
              return;
            }
            window.weatherDataCache = flights;
            window.weatherLastUpdate = new Date().toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit', second: '2-digit' }) + ' Z';
            renderWeather(flights);
          })
          .withFailureHandler(function() {
            if (settled) return;
            settled = true; clearTimeout(boardTo);
            window.wxShowBoardError('BOARD FAILED (getActiveFlightDataForWarning request failed) — click RETRY LOAD.');
          })
          .getActiveFlightDataForWarning();
        });
      };

      function renderWeather(flights) {
        const container = document.getElementById('weather-container');
        const esc = window.escapeHtml;
        const updateEl = document.getElementById('weather-last-update');
        if (updateEl && window.weatherLastUpdate) {
          updateEl.innerText = 'ACTIVE FLIGHT WATCH (UTC OPERATIONS) • LAST UPDATE: ' + window.weatherLastUpdate;
        }

        const activeBoardIds = window.activeBoardRowIds || [];
        const activeFlights = flights.filter(f => activeBoardIds.includes(f.rowIdx));

        if (activeFlights.length === 0) {
          container.innerHTML = '<div style="text-align: center; padding: 80px; color: var(--text-muted); font-family:var(--font-mono); border: 2px dashed var(--border-light); border-radius: 12px;">NO ACTIVE FLIGHTS ON BOARD</div>';
          return;
        }

        let kpiDanger = 0, kpiWarn = 0, kpiClear = 0, kpiNoData = 0;

        container.innerHTML = activeFlights.map((f, idx) => {
          const stdH = wxHourParts(f.std).hh;
          const staH = wxHourParts(f.sta).hh;
          const altWindowStart = (parseInt(staH) + 1) % 24;
          const altWindowEnd = (parseInt(staH) + 3) % 24;

          const depStatus = evaluateWeather(f.depApt, stdH, f.tafDep); const depRefs = window.wxRefs.slice(); const depTrig = wxShortTrigger(window.wxTriggerBlock);
          const arrStatus = evaluateWeather(f.arrApt, staH, f.tafArr); const arrRefs = window.wxRefs.slice(); const arrTrig = wxShortTrigger(window.wxTriggerBlock);
          const altStatus = evaluateWeather(f.altApt, altWindowStart, f.tafAlt); const altRefs = window.wxRefs.slice(); const altTrig = wxShortTrigger(window.wxTriggerBlock);

          // Flight-level worst status: DANGER > WARNING > NO DATA > CLEAR.
          const statuses = [depStatus, arrStatus, altStatus];
          let flightWorst = 'CLEAR';
          if (statuses.includes('DANGER')) { kpiDanger++; flightWorst = 'DANGER'; }
          else if (statuses.includes('WARNING')) { kpiWarn++; flightWorst = 'WARNING'; }
          else if (statuses.includes('NO_DATA')) { kpiNoData++; flightWorst = 'NO_DATA'; }
          else kpiClear++;
          const aggPill = flightWorst === 'DANGER'
            ? '<span class="wx-pill wx-pill-danger">1 RESTRICTED</span>'
            : flightWorst === 'WARNING'
              ? '<span class="wx-pill wx-pill-warning">1 MONITOR</span>'
              : flightWorst === 'NO_DATA'
                ? '<span class="wx-pill wx-pill-nodata">NO TAF — CHECK SOURCE</span>'
                : '<span class="wx-pill wx-pill-clear">OPERATIONAL</span>';
           const altWindowLabel = String(altWindowStart).padStart(2,'0') + ':00–' + String(altWindowEnd).padStart(2,'0') + ':00';
           const aiPending = !!((window.wxAiPending || {})[f.rowIdx]);
           const aiOff = window.wxAiEnabled === false;
           const aiBtnHtml = aiOff ? ''
            : aiPending
              ? '<button class="taf-details-btn" style="margin-left:6px;" disabled onclick="window.wxAiReview(this, ' + f.rowIdx + ')">ANALYZING...</button>'
              : '<button class="taf-details-btn" style="margin-left:6px;" onclick="window.wxAiReview(this, ' + f.rowIdx + ')">AI REVIEW</button>';

          const staggerDelay = Math.min(idx * 40, 240);
          return `
            <div class="weather-card animate-in" data-row="${f.rowIdx}" style="animation-delay:${staggerDelay}ms">
              <div class="wx-card-head">
                <div class="flight-info-group">
                  <div class="weather-flight-no">${esc(f.flightNo)}</div>
                  <div class="weather-route">${esc(f.depApt)} → ${esc(f.arrApt)} · ALT ${esc(f.altApt) || '???'}</div>
                </div>
                <div class="wx-head-right">${aggPill}
                  <button class="taf-details-btn" aria-expanded="false" aria-controls="wx-drawer-${f.rowIdx}" onclick="window.wxToggleDrawer(this)">Details</button>
                  ${aiBtnHtml}
                </div>
              </div>
              <div class="weather-card-main">
                <div class="weather-point ${getStatusClass(depStatus)}">
                  <div class="point-label">DEPARTURE · ${esc(f.depApt)}</div>
                  <div class="point-val">${esc(wxHourParts(f.std).label) || '--:--'}</div>
                  <div class="point-status">${getStatusLabel(depStatus)}</div>
                  ${depTrig ? '<div class="wx-trigger">' + depTrig + '</div>' : ''}
                  ${wxRefChips(depRefs)}
                </div>

                <div class="weather-point ${getStatusClass(arrStatus)}">
                  <div class="point-label">ARRIVAL · ${esc(f.arrApt)}</div>
                  <div class="point-val">${esc(wxHourParts(f.sta).label) || '--:--'}</div>
                  <div class="point-status">${getStatusLabel(arrStatus)}</div>
                  ${arrTrig ? '<div class="wx-trigger">' + arrTrig + '</div>' : ''}
                  ${wxRefChips(arrRefs)}
                </div>

                <div class="weather-point ${getStatusClass(altStatus)}">
                  <div class="point-label">ALT WINDOW · ${esc(f.altApt) || '???'} · ${altWindowLabel}</div>
                  <div class="point-val">${altWindowLabel}</div>
                  <div class="point-status">${getStatusLabel(altStatus)}</div>
                  ${altTrig ? '<div class="wx-trigger">' + altTrig + '</div>' : ''}
                  ${wxRefChips(altRefs)}
                </div>
              </div>
              
              <div class="wx-drawer-wrap" id="wx-drawer-${f.rowIdx}" aria-hidden="true"><div class="wx-drawer-inner"><div class="taf-drawer">
                <div class="taf-sub-block">
                  <div class="taf-sub-header"><span>TAF DEP (${esc(f.depApt)})</span> <span>${esc(wxTafTimeLabel(f.tafDepTime))} Z</span></div>
                  <div class="taf-text">${formatTafText(f.tafDep)}</div>
                </div>
                <div class="taf-sub-block">
                  <div class="taf-sub-header"><span>TAF ARR (${esc(f.arrApt)})</span> <span>${esc(wxTafTimeLabel(f.tafArrTime))} Z</span></div>
                  <div class="taf-text">${formatTafText(f.tafArr)}</div>
                </div>
                <div class="taf-sub-block">
                  <div class="taf-sub-header"><span>TAF ALT (${esc(f.altApt) || 'NIL'})</span> <span>${esc(wxTafTimeLabel(f.tafAltTime))} Z</span></div>
                  <div class="taf-text">${formatTafText(f.tafAlt)}</div>
                </div>
              </div></div></div>
              ${window.wxAiCached(f.rowIdx)}
            </div>
          `;
        }).join('');

        const s = (id, v) => { const el = document.getElementById(id); if (el) el.innerText = v; };
        s('wx-kpi-total', activeFlights.length);
        s('wx-kpi-danger', kpiDanger);
        s('wx-kpi-warn', kpiWarn);
        s('wx-kpi-clear', kpiClear);
        s('wx-kpi-nodata', kpiNoData);
        window.wxAiDrawerSync();
        if (!window.wxAiMasterHooked) {
          window.wxAiMasterHooked = true;
          document.addEventListener('change', function(ev) {
            if (ev && ev.target && ev.target.id === 'wx-ai-model') window.wxAiDrawerSync();
          });
        }
      }
    })();
  </script>
</div>
