<div id="view-report" class="view-section">
  <div class="report-control-bar">
    <div class="rcb-info">
      <h2 class="header-title">BRIEFING REPORT</h2>
      <div class="header-sub">
        SYSTEM READY <span class="sep">|</span> BRIEFING PACKAGE COMPILATION v2.4
      </div>
    </div>
    <div class="rcb-actions" style="display: flex; gap: 12px; flex-wrap: wrap;">
      <button class="control-btn" onclick="window.resetReportEngine()"><svg class="ic ic-sm"><use href="#i-sync"/></svg> RESET FORM</button>
      <button class="btn-execute-cbr btn-solid-primary" onclick="window.compileFinalCbr()" id="btn-exec-cbr">
        <svg class="ic ic-sm"><use href="#i-bolt"/></svg> CREATE REPORT
      </button>
      <button class="btn-execute-cbr btn-solid-primary" onclick="window.openBriefingForm()" id="btn-open-form">
        <svg class="ic ic-sm"><use href="#i-bolt"/></svg> OPEN EDITABLE FORM
      </button>
      <button class="btn-execute-cbr btn-solid-primary" onclick="window.openReportWeb1()" id="btn-download-sheet" title="Open the Google Sheets report generator">
        <svg class="ic ic-sm"><use href="#i-download"/></svg> DOWNLOAD SHEET
      </button>
      <button class="btn-execute-cbr btn-solid-primary" onclick="window.createReportGoogleSheet()" id="btn-google-sheet" disabled title="Create the report in your Google Drive and open Google Sheets">CREATE GOOGLE SHEET</button>
    </div>
  </div>
  
  <div class="report-split-container">
    <div class="report-sidebar">
      <div class="summary-card">
        <div class="summary-header">BRIEFING CONTEXT</div>
        <div class="summary-item">
          <span class="summary-label">FLIGHTS SELECTED</span>
          <span class="summary-val" id="report-sum-count">0</span>
        </div>
        <div class="summary-item">
          <span class="summary-label">FLIGHT NUMBERS</span>
          <div class="summary-list" id="report-sum-flights">NONE</div>
        </div>
        <div class="summary-item">
          <span class="summary-label">NOTAM SYNC</span>
          <span class="summary-val" id="report-sum-notams">0</span>
        </div>
        <div class="summary-sep"></div>
        <div class="summary-item">
          <span class="summary-label">ENGINE READINESS</span>
          <span class="summary-val" id="report-sum-status" style="color: var(--status-warning);">AWAITING CONTEXT</span>
        </div>
      </div>
    </div>
    
    <div class="report-main">
      <div id="report-status" class="terminal-window" style="display: none;"></div>
    </div>
  </div>

  <style>
    /* fonts loaded via Index.html preconnect */
    /* a11y: local focus ring (global lives in Index.html shell) */
    #view-report button:focus-visible, #view-report [role="button"]:focus-visible { outline:3px solid var(--accent-primary); outline-offset:2px; }
    /* =========================================================
       AWQ BRIEFING TERMINAL (SPLIT PANEL)
       ========================================================= */
    .report-control-bar {
      display: flex; justify-content: space-between; align-items: center;
      min-width: 0;
      background: var(--nav-item-bg); 
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--border-light);
      padding: 24px 32px; border-radius: var(--radius-lg); 
      margin-bottom: 24px;
      box-shadow: var(--shadow-soft);
    }
    
    .report-split-container {
      display: grid;
      grid-template-columns: 340px 1fr;
      gap: 24px;
      align-items: start;
    }

    .report-sidebar {
      position: sticky;
      top: 120px;
      min-width: 0;
    }

    .summary-card {
      background: var(--bg-panel);
      border: 1px solid var(--border-light);
      border-radius: var(--radius-lg);
      padding: 24px;
      box-shadow: var(--shadow-soft);
    }

    .summary-header {
      font-size: 12px;
      font-weight: 900;
      color: var(--accent-primary);
      letter-spacing: 0.15em;
      margin-bottom: 24px;
      padding: 0 0 12px 12px;
      border-bottom: 1px solid var(--border-subtle);
      border-left: 3px solid var(--accent-primary);
    }

    .summary-item { margin-bottom: 20px; }
    .summary-label {
      display: block;
      font-size: 11px;
      font-weight: 800;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 6px;
    }
    .summary-val {
      font-family: var(--font-mono);
      font-size: 18px;
      font-weight: 700;
      color: var(--text-primary);
    }
    .summary-list {
      font-family: var(--font-mono);
      font-size: 13px;
      color: var(--text-secondary);
      line-height: 1.6;
      max-height: none;
      overflow-y: visible;
      padding-right: 0;
    }
    .summary-sep { height: 1px; background: var(--border-subtle); margin: 20px 0; }
    .flight-row { display:flex; align-items:center; gap:10px; padding:8px 10px; border:1px solid var(--border-subtle); border-radius:var(--radius-sm); margin-bottom:8px; background:var(--bg-panel-alt); }
    .flight-row-main { flex:1; font-family:var(--font-mono); font-size:13px; font-weight:700; color:var(--text-primary); }
    .flight-row-no-sig { display:inline-flex; align-items:center; gap:6px; font-size:10px; font-weight:800; letter-spacing:.06em; text-transform:uppercase; color:var(--text-muted); cursor:pointer; user-select:none; white-space:nowrap; }
    .flight-row-no-sig input { accent-color: var(--accent-primary); width:14px; height:14px; }
    .flight-row-no-sig.active { color: var(--status-info); }
    .no-sig-hint { font-size:10px; color:var(--text-muted); font-family:var(--font-mono); margin-top:6px; line-height:1.4; }
    .conflict-warn { background: var(--status-warning-bg); border:1px solid var(--status-warning); color: var(--status-warning); padding:6px 8px; border-radius:var(--radius-sm); font-size:10px; font-family:var(--font-mono); margin-top:8px; }

    .btn-execute-cbr {
      padding: 0 32px; height: 44px;
      font-size: 11px; font-weight: 900; 
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    /* TERMINAL WINDOW */
    .terminal-window {
      background: var(--bg-panel-sunken); 
      border: 1px solid var(--border-light); 
      border-radius: var(--radius-lg); 
      padding: 32px; 
      font-family: var(--font-mono); 
      font-size: 14.5px; line-height: 1.7; 
      min-height: 480px; max-height: 650px; 
      overflow-y: auto; color: var(--text-primary); 
      box-shadow: var(--overlay-inset);
      position: relative;
    }
    .terminal-window::after {
      content: ""; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background: linear-gradient(var(--scanline) 1px, transparent 1px);
      background-size: 100% 3px;
      pointer-events: none;
      opacity: 0.2;
    }
    
    .terminal-header {
      color: var(--accent-primary); font-weight: 900; margin-bottom: 24px;
      font-size: 12px; letter-spacing: 0.2em; text-transform: uppercase;
      border-bottom: 1px solid var(--border-subtle); padding-bottom: 16px;
      opacity: 0.8;
    }

    .terminal-line { 
      display: flex; gap: 14px; padding: 4px 0; 
      animation: termFadeIn 0.3s ease-out forwards; 
    }
    @keyframes termFadeIn { from { opacity: 0; transform: translateX(-6px); } to { opacity: 1; transform: translateX(0); } }

    .terminal-timestamp { color: var(--text-disabled); font-size: 12.5px; white-space: nowrap; opacity: 0.6; }
    .terminal-prompt { color: var(--accent-primary); opacity: 0.6; font-weight: 900; }
    
    .term-success { color: var(--status-safe); }
    .term-error { color: var(--status-critical); background: rgba(255, 77, 77, 0.1); padding: 0 6px; border-radius: 3px; }
    .term-warn { color: var(--status-warning); }
    .term-info { color: var(--status-info); }

    @media (max-width: 1200px) {
      .report-split-container { grid-template-columns: minmax(0, 1fr); }
      .report-sidebar { position: static; }
    }
    @media (max-width: 600px) {
      #view-report .report-control-bar { align-items: stretch; flex-direction: column; padding: 16px; }
      #view-report .report-control-bar > * { min-width: 0; }
      #view-report .btn-execute-cbr { width: 100%; min-height: 44px; }
      #view-report .terminal-window { min-width: max-content; }
    }
    @media print {
      #view-report .report-control-bar, #view-report .report-sidebar { display: none !important; }
      #view-report .report-split-container { display: block; }
      #view-report .terminal-window { background: #fff !important; color: #000 !important; border: 1px solid #000; }
      #view-report .terminal-window * { color: #000 !important; background: transparent !important; }
    }
  </style>

  <script>
    window.reportState = { isBusy: false, lastHash: "", lastFlightSelectionKey: null };

    const esc = window.escapeHtml;

    // ---- NO SIGNIFICANT helpers (per-station B1) ----
    function getNoSigStationMap(){
      return window.safeStorage ? window.safeStorage.get('occ_report_no_sig_station', {}) : {};
    }
    function setNoSigStation(stn, val){
      var m = getNoSigStationMap();
      var key = String(stn).trim().toUpperCase();
      if(val) m[key]=true; else delete m[key];
      if (window.safeStorage) window.safeStorage.set('occ_report_no_sig_station', m);
      window.renderReportPreview();
    }
    window.getNoSigStationMap = getNoSigStationMap;
    // keep legacy per-flight key for migration/clear
    function getNoSigMap(){ return getNoSigStationMap(); }

    function getReportFlightSelectionKey(flights){
      return (flights || []).map(function(f){ return String(f.rowIdx); }).sort().join(',');
    }
    function resetNoSigOnFlightChange(selectedFlights){
      var nextKey = getReportFlightSelectionKey(selectedFlights);
      var previousKey = window.reportState.lastFlightSelectionKey;
      if (previousKey === null && window.safeStorage) previousKey = window.safeStorage.get('occ_report_no_sig_flight_key', null);
      var changed = previousKey !== null && previousKey !== nextKey;
      if (changed && window.safeStorage) window.safeStorage.remove('occ_report_no_sig_station');
      window.reportState.lastFlightSelectionKey = nextKey;
      if (window.safeStorage) window.safeStorage.set('occ_report_no_sig_flight_key', nextKey);
      return changed;
    }

     window.renderReportPreview = function() {
       const statusDiv = document.getElementById('report-status');
       const btn = document.getElementById('btn-exec-cbr');
       const btnOpenForm = document.getElementById('btn-open-form');
       const btnSheet = document.getElementById('btn-download-sheet');
       const selectedFlights = window.getSelectedFlightObjects ? window.getSelectedFlightObjects() : [];
       resetNoSigOnFlightChange(selectedFlights);
       if (window.updateGoogleReportButton) window.updateGoogleReportButton();
       
         // Get NOTAM analysis count
        let notamCount = 0;
        let analysis = window.safeStorage ? window.safeStorage.get('occ_notam_analysis', {}) : {};
        if (analysis && typeof analysis === 'object') {
          Object.values(analysis).forEach(arr => { if(Array.isArray(arr)) notamCount += arr.length; });
        }
        var noSigStationMap = getNoSigStationMap();
        // stations from selected flights
        var stations = [...new Set(selectedFlights.flatMap(function(f){ return [f.DEP,f.ARR,f.ALT,f.ENR1,f.ENR2,f.ENR3].map(function(s){ return s? String(s).trim().toUpperCase():''; }).filter(Boolean); }))];
        var noSigCount = stations.filter(function(s){ return !!noSigStationMap[s]; }).length;

        // Update Summary Sidebar
        if (document.getElementById('report-sum-count')) document.getElementById('report-sum-count').innerText = selectedFlights.length;
        if (document.getElementById('report-sum-notams')) document.getElementById('report-sum-notams').innerText = notamCount + (noSigCount? ' + '+noSigCount+' NO SIG':'');
        if (document.getElementById('report-sum-flights')) {
          var box = document.getElementById('report-sum-flights');
          if(selectedFlights.length===0){
            box.innerHTML='NONE SELECTED';
          } else {
            var html='<div style="margin-bottom:8px;">'+selectedFlights.map(function(f){ return '• '+esc(f.FLIGHT)+' '+esc(f.DEP||'')+'→'+esc(f.ARR||''); }).join('<br>')+'</div>';
            html+='<div style="font-size:10px;font-weight:900;letter-spacing:.08em;text-transform:uppercase;color:var(--text-secondary);margin:12px 0 6px;">STATION NO SIGNIFICANT</div>';
            if(stations.length===0){
              html+='<div style="font-size:11px;color:var(--text-muted);">No stations</div>';
            } else {
              stations.forEach(function(stn){
                var isNoSig = !!noSigStationMap[stn];
                html += '<div class="flight-row">'
                  + '<span class="flight-row-main">'+esc(stn)+'</span>'
                  + '<label class="flight-row-no-sig'+(isNoSig?' active':'')+'"><input type="checkbox" aria-label="No significant weather for '+esc(stn)+'" data-no-sig-station="'+esc(stn)+'" '+(isNoSig?'checked':'')+'> NO SIG</label>'
                  + '</div>';
              });
            }            box.innerHTML=html;
            box.querySelectorAll('[data-no-sig-station]').forEach(function(cb){
              cb.addEventListener('change', function(){ setNoSigStation(cb.getAttribute('data-no-sig-station'), cb.checked); });
            });
          }
        }
        
        const sumStatus = document.getElementById('report-sum-status');
        if (sumStatus) {
          if (selectedFlights.length === 0) {
             sumStatus.innerText = 'AWAITING CONTEXT';
             sumStatus.style.color = 'var(--status-warning)';
          } else if(noSigCount>0){
               sumStatus.innerText = 'READY — '+noSigCount+' NO SIG STATION';
               sumStatus.style.color = 'var(--status-info)';
          } else {
               sumStatus.innerText = 'READY TO GENERATE';
               sumStatus.style.color = 'var(--status-safe)';
          }
        }

        // Create a persistent hash based on unique flight row IDs and NOTAM count + NO SIG station
        const currentHash = selectedFlights.map(f => f.rowIdx).sort().join(',') + `|notams:${notamCount}|nosigSt:${JSON.stringify(noSigStationMap)}`;
        
        // IF busy or already showing results for the SAME selection, do NOT reset
        if (window.reportState.isBusy || (statusDiv.innerHTML.length > 50 && window.reportState.lastHash === currentHash)) {
            console.log('[REPORT] State persistent: Selection/NOTAMs unchanged or process active.');
            return;
        }

       window.reportState.lastHash = currentHash;
       statusDiv.style.display = 'block';
       statusDiv.innerHTML = '<div class="terminal-header">AWQ :: BRIEFING ENGINE :: CORE_STABLE_v2.4</div>';
       
        if (selectedFlights.length === 0) {
            btn.disabled = true;
            btn.innerHTML = `WAITING FOR CONTEXT`;
            if (btnOpenForm) btnOpenForm.disabled = true;
            if (btnSheet) btnSheet.disabled = true;
            printTerminalLine("CRITICAL: NO FLIGHT DATA DETECTED IN ACTIVE CACHE.", "error");
            printTerminalLine("INSTRUCTION: SELECT AT LEAST ONE FLIGHT FROM MONITORING BOARD.", "warn");
        } else {
            btn.disabled = false;
            btn.innerHTML = `<svg class="ic ic-sm"><use href="#i-bolt"/></svg> CREATE REPORT`;
            if (btnOpenForm) btnOpenForm.disabled = false;
            if (btnSheet) btnSheet.disabled = false;
            printTerminalLine(`SYSTEM READY: ${selectedFlights.length} FLIGHTS DETECTED.`, "success");
           if (noSigCount>0) printTerminalLine(`NO SIG: ${noSigCount} STATION(S) MARKED NO SIGNIFICANT NOTAM.`, "info");
           if (notamCount > 0) {
             printTerminalLine(`NOTAM SYNC: ${notamCount} ANALYSIS SELECTIONS IMPORTED.`, "success");
           } else {
             printTerminalLine("NOTAM SYNC: NO MANUAL SELECTIONS FOUND IN ANALYSIS DESK.", "warn");
           }
           // Info B: actual NOTAM wins if station flagged but a real NOTAM exists
           if(noSigCount>0 && notamCount>0) printTerminalLine("INFO: B — If a station is NO SIG but a real NOTAM exists for it, the real NOTAM will show.", "info");
           printTerminalLine("AWAITING OPERATOR CONFIRMATION TO PROCEED...", "info");
       }
    };

    window.resetReportEngine = function() {
      if (window.reportState.isBusy) return;
      window.reportState.lastHash = "";
      const statusDiv = document.getElementById('report-status');
      statusDiv.innerHTML = '<div class="terminal-header">AWQ :: BRIEFING ENGINE :: CORE_STABLE_v2.4</div>';
      printTerminalLine("MANUAL RESET TRIGGERED. RE-SYNCING WITH MISSION_DB AND NOTAM_ANALYSIS...", "info");
      setTimeout(() => window.renderReportPreview(), 300);
    };

    const printTerminalLine = (text, type='info', opts={}) => {
       const statusDiv = document.getElementById('report-status');
       const d = new Date();
       const timeStr = `${String(d.getUTCHours()).padStart(2,'0')}:${String(d.getUTCMinutes()).padStart(2,'0')}:${String(d.getUTCSeconds()).padStart(2,'0')}Z`;

       const typeMap = { 'success': 'term-success', 'error': 'term-error', 'warn': 'term-warn', 'info': 'term-info' };
       const colorClass = typeMap[type] || 'term-info';
       // Terminal lines are text by default; raw HTML only for internally
       // constructed, pre-escaped content (opts.allowRawHtml).
       const body = opts.allowRawHtml ? String(text) : esc(text);

       statusDiv.insertAdjacentHTML('beforeend', `
         <div class="terminal-line">
            <span class="terminal-timestamp">[${timeStr}]</span>
            <span class="terminal-prompt">></span>
            <span class="${colorClass}">${body}</span>
         </div>
       `);
       statusDiv.scrollTop = statusDiv.scrollHeight;
    };
    window.printReportTerminalLine = printTerminalLine;

    window.getReportSheetPayload = function() {
      const selectedFlights = window.getSelectedFlightObjects ? window.getSelectedFlightObjects() : [];
      return {
        flights: selectedFlights.map(function(f){ return f.FLIGHT; }).filter(Boolean),
        notamAnalysis: window.safeStorage ? window.safeStorage.get('occ_notam_analysis', {}) : {},
        noSigMap: getNoSigStationMap()
      };
    };

    // ============================================================
    // WEB 1 REPORT HANDOFF (B0 transport proof build)
    // READY -> CONTEXT -> ACCEPTED, iframe-aware per implementation plan §3.
    // Audit/generation backend is Gate B; this build only proves transport.
    // ============================================================
    const REPORT_WEB1_URL = window.__REPORT_WEB1_URL_OVERRIDE || 'https://script.google.com/macros/s/AKfycbz0gdvfrKdGu-7LovIZylT7q-REolKKBNmCRUOL13Dd9gdUZhDmeb6134hMKfv5wLPajA/exec';
    const REPORT_WEB1_ORIGINS = window.__REPORT_WEB1_ORIGINS || null; // exact-origin override for local tests
    const REPORT_MAX_TOTAL_BYTES = 64 * 1024; // locked from real-data measurement (tests/measure_payload_size.mjs)
    const REPORT_MAX_TEXT_BYTES = 8 * 1024;
    // Receipt window: must cover an Apps Script cold start of the receipt RPC
    // (measured ~34 s on the first call). Overridable for fast tests.
    const REPORT_RECEIPT_TIMEOUT_MS = window.__REPORT_RECEIPT_TIMEOUT_MS || 45000;

    function reportByteLength_(s) {
      try { return new TextEncoder().encode(String(s)).length; } catch (e) { return String(s).length; }
    }

    function reportOversizeText_(payload) {
      var taf = payload.tafContext || [];
      for (var i = 0; i < taf.length; i++) {
        if (taf[i].text && reportByteLength_(taf[i].text) > REPORT_MAX_TEXT_BYTES) {
          return { kind: 'TAF', label: taf[i].station, bytes: reportByteLength_(taf[i].text) };
        }
      }
      var notam = payload.notamContext || [];
      for (var j = 0; j < notam.length; j++) {
        if (notam[j].text && reportByteLength_(notam[j].text) > REPORT_MAX_TEXT_BYTES) {
          return { kind: 'NOTAM', label: notam[j].id, bytes: reportByteLength_(notam[j].text) };
        }
      }
      return null;
    }

    function isReportWeb1Origin(origin) {
      if (REPORT_WEB1_ORIGINS) return REPORT_WEB1_ORIGINS.includes(origin);
      if (origin === 'https://script.google.com') return true;
      if (origin === 'https://script.googleusercontent.com') return true;
      // hashed Apps Script user-content subdomain, e.g. n-<hash>-<n>-lu-script.googleusercontent.com
      return /^https:\/\/[a-z0-9-]+-script\.googleusercontent\.com$/.test(origin);
    }
    let reportWeb1Window = null;    // top-level popup returned by window.open()
    let reportWeb1Transfer = null;  // { nonce, payload, peer, peerOrigin, sent, receiptTimer }

    function getReportWeb1Payload() {
      const selectedFlights = window.getSelectedFlightObjects ? window.getSelectedFlightObjects() : [];
      const rid = (window.crypto && typeof window.crypto.randomUUID === 'function')
        ? window.crypto.randomUUID()
        : ('req-' + Date.now() + '-' + Math.random().toString(36).slice(2));

      // Station metadata: which roles/flights use each station (DEP/ARR/ALT/ENR).
      const roleFor = { DEP: 'DEP', ARR: 'ARR', ALT: 'ALT', ENR1: 'ENR', ENR2: 'ENR', ENR3: 'ENR' };
      const stationMeta = {};
      const stationOrder = [];
      selectedFlights.forEach(function(f) {
        ['DEP', 'ARR', 'ALT', 'ENR1', 'ENR2', 'ENR3'].forEach(function(k) {
          const s = f[k] ? String(f[k]).trim().toUpperCase() : '';
          if (!s) return;
          if (!stationMeta[s]) { stationMeta[s] = { roles: [], flights: [] }; stationOrder.push(s); }
          if (stationMeta[s].roles.indexOf(roleFor[k]) === -1) stationMeta[s].roles.push(roleFor[k]);
          if (stationMeta[s].flights.indexOf(f.FLIGHT) === -1) stationMeta[s].flights.push(f.FLIGHT);
        });
      });

      // Full raw TAF text from Web 2's registry view (Taf_Ui); unavailable is explicit.
      const tafBase = (typeof window.getReportTafContext === 'function')
        ? window.getReportTafContext(stationOrder)
        : stationOrder.map(function(s) { return { station: s, text: '', issueTime: null, available: false }; });
      const tafContext = tafBase.map(function(t) {
        const meta = stationMeta[t.station] || { roles: [], flights: [] };
        return Object.assign({}, t, { roles: meta.roles, flights: meta.flights });
      });

      // Full selected NOTAM text from Web 2's analyzeNotams response (Notam_Ui).
      // Aerodrome scope only: FIR/UIR-wide NOTAMs are dropped in the builder.
      const notamContext = (typeof window.getReportNotamContext === 'function')
        ? window.getReportNotamContext(selectedFlights)
        : [];
      const notamScope = (window.reportNotamScope && window.reportNotamScope.available)
        ? {
            rule: 'AERODROME_ONLY',
            droppedFirWide: (window.reportNotamScope.dropped || []).length,
            dropped: (window.reportNotamScope.dropped || []).map(function(d) {
              return { id: d.id, station: d.station };
            })
          }
        : { rule: 'AERODROME_ONLY', droppedFirWide: 0, dropped: [] };

      return {
        version: 1,
        reportRequestId: rid,
        requestedAt: new Date().toISOString(),
        flights: selectedFlights,
        tafContext: tafContext,
        notamContext: notamContext,
        notamScope: notamScope,
        savedNotamAnalysis: window.safeStorage ? window.safeStorage.get('occ_notam_analysis', {}) : {},
        noSigStationMap: getNoSigStationMap()
      };
    }

    function isReportWeb1ReadyMessage(event) {
      if (!reportWeb1Transfer || !reportWeb1Transfer.nonce) return false;
      if (!isReportWeb1Origin(event.origin)) return false;
      if (!event.data || event.data.type !== 'AWQ_REPORT_READY' || event.data.nonce !== reportWeb1Transfer.nonce) return false;
      // iframe-aware: READY source must belong to the tab we opened (event.source.top === popup)
      try { return !!event.source && event.source.top === reportWeb1Window; }
      catch (e) { return false; }
    }

    function isReportWeb1ReceiptMessage(event) {
      if (!reportWeb1Transfer || !reportWeb1Transfer.peer) return false;
      return event.source === reportWeb1Transfer.peer &&
        event.origin === reportWeb1Transfer.peerOrigin &&
        !!event.data &&
        (event.data.type === 'AWQ_REPORT_ACCEPTED' || event.data.type === 'AWQ_REPORT_REJECTED') &&
        event.data.nonce === reportWeb1Transfer.nonce;
    }

    window.openReportWeb1 = function() {
      if (window.reportState.isBusy) return;
      const payload = getReportWeb1Payload();
      if (!Array.isArray(payload.flights) || payload.flights.length < 1 || payload.flights.length > 4) {
        printTerminalLine('DOWNLOAD SHEET: Select 1 to 4 flights first.', 'warn');
        return;
      }
      // Locked size limits: reject oversized context outright (never truncate).
      const totalBytes = reportByteLength_(JSON.stringify(payload));
      if (totalBytes > REPORT_MAX_TOTAL_BYTES) {
        printTerminalLine('DOWNLOAD SHEET: Report context is ' + totalBytes + ' bytes, over the ' + Math.round(REPORT_MAX_TOTAL_BYTES / 1024) + ' KiB limit. Reduce the selected NOTAMs.', 'error');
        return;
      }
      const oversize = reportOversizeText_(payload);
      if (oversize) {
        printTerminalLine('DOWNLOAD SHEET: ' + oversize.kind + ' text for ' + oversize.label + ' is ' + oversize.bytes + ' bytes, over the ' + Math.round(REPORT_MAX_TEXT_BYTES / 1024) + ' KiB per-text limit.', 'error');
        return;
      }
      const sourceOrigin = window.location.origin;
      if (!/^https?:$/.test(window.location.protocol) || !sourceOrigin || sourceOrigin === 'null') {
        printTerminalLine('DOWNLOAD SHEET: The report handoff requires the deployed Web 2 origin.', 'error');
        return;
      }
      const nonce = (window.crypto && typeof window.crypto.randomUUID === 'function')
        ? window.crypto.randomUUID()
        : String(Date.now()) + '-' + Math.random().toString(36).slice(2);
      const reportUrl = new URL(REPORT_WEB1_URL);
      reportUrl.searchParams.set('page', 'report');
      // one-time control values in the fragment (never sent as HTTP query/referrer)
      reportUrl.hash = 'nonce=' + encodeURIComponent(nonce) + '&sourceOrigin=' + encodeURIComponent(sourceOrigin);
      window.__gatecPendingHandoff = { nonce: nonce, reportRequestId: payload.reportRequestId };

      reportWeb1Transfer = { nonce: nonce, payload: payload, peer: null, peerOrigin: null, sent: false, receiptTimer: null };
      reportWeb1Window = window.open(reportUrl.toString(), '_blank');
      if (!reportWeb1Window) {
        window.__gatecTransferState = { state: 'POPUP_BLOCKED', reportRequestId: payload.reportRequestId };
        reportWeb1Transfer = null;
        printTerminalLine('DOWNLOAD SHEET: Allow pop-ups to open the Google Sheets report.', 'error');
        return;
      }
      printTerminalLine('DOWNLOAD SHEET: Opening Web 1 REPORT and waiting for readiness...', 'info');
      // 30-second readiness timeout
      var reportReadyTimeoutMs = window.__REPORT_READY_TIMEOUT_MS || 30000;
      setTimeout(function() {
        if (reportWeb1Transfer && !reportWeb1Transfer.sent) {
          window.__gatecTransferState = { state: 'READY_TIMEOUT', reportRequestId: reportWeb1Transfer.payload.reportRequestId };
          printTerminalLine('DOWNLOAD SHEET: Web 1 did not signal ready within ' + Math.round(reportReadyTimeoutMs / 1000) + ' seconds.', 'error');
          reportWeb1Transfer = null;
        }
      }, reportReadyTimeoutMs);
    };

    window.addEventListener('message', function(event) {
      if (reportWeb1Transfer && !reportWeb1Transfer.sent && isReportWeb1ReadyMessage(event)) {
        // pin the validated iframe peer; send CONTEXT to the peer, not the outer popup
        reportWeb1Transfer.peer = event.source;
        reportWeb1Transfer.peerOrigin = event.origin;
        reportWeb1Transfer.sent = true;
        window.__gatecContextSent = { reportRequestId: reportWeb1Transfer.payload.reportRequestId, nonce: reportWeb1Transfer.nonce, peerOrigin: event.origin };
        event.source.postMessage(
          { type: 'AWQ_REPORT_CONTEXT', nonce: reportWeb1Transfer.nonce, payload: reportWeb1Transfer.payload },
          event.origin
        );
        printTerminalLine('DOWNLOAD SHEET: Flight context sent to validated Web 1 iframe peer.', 'success');
        // 10-second receipt timeout
        reportWeb1Transfer.receiptTimer = setTimeout(function() {
          if (reportWeb1Transfer) {
            window.__gatecTransferState = { state: 'RECEIPT_UNKNOWN', reportRequestId: reportWeb1Transfer.payload.reportRequestId };
            printTerminalLine('DOWNLOAD SHEET: No receipt within ' + Math.round(REPORT_RECEIPT_TIMEOUT_MS / 1000) + ' seconds. Web 1 may still be starting; CHECK REPORT STATUS in Web 1 with request ID ' + reportWeb1Transfer.payload.reportRequestId + '.', 'warn');
          }
        }, REPORT_RECEIPT_TIMEOUT_MS);
        return;
      }
      if (isReportWeb1ReceiptMessage(event)) {
        if (event.data.type === 'AWQ_REPORT_ACCEPTED') {
          printTerminalLine('DOWNLOAD SHEET: Web 1 accepted the report context (request ' + event.data.reportRequestId + '). Confirm in Web 1 to generate.', 'success');
          // Scope warning: the report carries aerodrome NOTAMs only.
          if (event.data.warning) printTerminalLine('DOWNLOAD SHEET: ' + event.data.warning, 'warn');
        } else {
          printTerminalLine('DOWNLOAD SHEET: Web 1 rejected the report context: ' + (event.data.reason || 'unknown reason'), 'error');
        }
        if (reportWeb1Transfer && reportWeb1Transfer.receiptTimer) clearTimeout(reportWeb1Transfer.receiptTimer);
        window.__gatecTransferState = {
          state: event.data.type === 'AWQ_REPORT_ACCEPTED' ? 'ACCEPTED' : 'REJECTED',
          reportRequestId: event.data.reportRequestId || '',
          reason: event.data.reason || ''
        };
        reportWeb1Transfer = null;
      }
    });

    // Helper: accept absolute http/https OR same-origin relative /briefing or /briefing-form URLs
    window.isValidReportUrl = function(u) {
      if (!u || typeof u !== 'string') return false;
      u = u.trim();
      if (/^https?:\/\/[^\/]+/i.test(u)) return true;
      if (/^(\/(briefing|briefing-form)[?\/][^\s"'<>]*$)/.test(u)) return true;
      return false;
    };

     window.openBriefingForm = function() {
      const selectedFlights = window.getSelectedFlightObjects ? window.getSelectedFlightObjects() : [];
      if (selectedFlights.length === 0) return;
      const callSigns = selectedFlights.map(function(f){ return f.FLIGHT; }).filter(Boolean);
      if (callSigns.length === 0) return;
      const formUrl = '/briefing-form?flights=' + encodeURIComponent(callSigns.join(','));
      window.open(formUrl, '_blank', 'noopener,noreferrer');
    };

     window.downloadReportXlsx = function() {
       if (window.reportState.isBusy) return;
       const selectedFlights = window.getSelectedFlightObjects ? window.getSelectedFlightObjects() : [];
       if (selectedFlights.length === 0) {
         printTerminalLine("DOWNLOAD SHEET: No flights selected.", "warn");
         return;
       }
       const callSigns = selectedFlights.map(function(f){ return f.FLIGHT; }).filter(Boolean);
       if (callSigns.length === 0) return;
       const btnSheet = document.getElementById('btn-download-sheet');
       window.reportState.isBusy = true;
       ['btn-exec-cbr', 'btn-open-form', 'btn-google-sheet'].forEach(function(id) {
         document.getElementById(id).disabled = true;
       });
       if (btnSheet) { btnSheet.disabled = true; btnSheet.innerHTML = '<svg class="ic ic-sm"><use href="#i-sync"/></svg> GENERATING XLSX...'; }
       printTerminalLine("SHEET: Generating Crew Briefing XLSX (CBR + WX + NOTAM) for " + callSigns.join(', ') + " ...", "info");
       fetch('/api/rpc', {
         method: 'POST',
         headers: { 'Content-Type': 'application/json' },
         body: JSON.stringify({ method: 'generateReportXlsx', args: [window.getReportSheetPayload()] })
       }).then(function(res){
         if (!res.ok) return res.text().then(function(t){ throw new Error(t || ('HTTP ' + res.status)); });
         return res.blob();
       }).then(function(blob){
         const a = document.createElement('a');
         a.href = URL.createObjectURL(blob);
         a.download = 'Crew-Briefing-' + callSigns.join('-') + '.xlsx';
         document.body.appendChild(a);
         a.click();
         setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 1000);
         printTerminalLine("SHEET: XLSX downloaded — " + callSigns.join('-') + ".xlsx", "success");
       }).catch(function(err){
         printTerminalLine("SHEET FAILED: " + (err && err.message ? err.message : 'unknown error'), "error");
       }).then(function(){
         window.reportState.isBusy = false;
         ['btn-exec-cbr', 'btn-open-form'].forEach(function(id) {
           document.getElementById(id).disabled = false;
         });
         if (window.updateGoogleReportButton) window.updateGoogleReportButton();
         if (btnSheet) { btnSheet.disabled = false; btnSheet.innerHTML = '<svg class="ic ic-sm"><use href="#i-download"/></svg> DOWNLOAD SHEET (XLSX)'; }
       });
     };

    window.compileFinalCbr = function() {
        const selectedFlights = window.getSelectedFlightObjects ? window.getSelectedFlightObjects() : [];
        if (selectedFlights.length === 0) return;
        
        const btn = document.getElementById('btn-exec-cbr');
        const btnOpenForm = document.getElementById('btn-open-form');
        const statusDiv = document.getElementById('report-status');
        
        window.reportState.isBusy = true;
        if (window.updateGoogleReportButton) window.updateGoogleReportButton();
        btn.disabled = true;
        if (btnOpenForm) btnOpenForm.disabled = true;
        const btnSheetBusy = document.getElementById('btn-download-sheet');
        if (btnSheetBusy) btnSheetBusy.disabled = true;
        btn.innerHTML = `<svg class="ic ic-sm"><use href="#i-bolt"/></svg> GENERATING...`;
       
        statusDiv.innerHTML = '<div class="terminal-header">AWQ :: BRIEFING ENGINE :: CORE_STABLE_v2.4</div>';
        printTerminalLine("PROCESS START: INITIALIZING DYNAMIC COMPILATION...", "info");
        
        const uxSteps = [
          "ESTABLISHING SECURE HANDSHAKE WITH MISSION_DB...",
          "VALIDATING ROUTE PROFILES AND EQUIPMENT REGISTRY...",
          "PREPPING DYNAMIC BRIEFING TEMPLATES...",
          "FETCHING LIVE WEATHER DATA FROM GLOBAL ENDPOINTS...",
          "CORRELATING NOTAM ANALYTICS WITH FLIGHT WINDOWS...",
          "INJECTING STRUCTURED DATA INTO BRIEFING CONTEXT..."
        ];
        
        let stepIndex = 0;
        const statusCycle = setInterval(() => {
            if (stepIndex < uxSteps.length) {
                printTerminalLine(uxSteps[stepIndex++], "info");
            } else {
                clearInterval(statusCycle);
                printTerminalLine("WAIT: FINALIZING PACKAGE AND GENERATING ACCESS URL...", "warn");
            }
        }, 1200);

        let savedNotamAnalysis = window.safeStorage ? window.safeStorage.get('occ_notam_analysis', {}) : {};
        let noSigStationMap = getNoSigStationMap();
        // Per-station B: warn if station flagged but has selections (actual wins) — not blocking, just info
        try{
          var stationsForCheck = [...new Set(selectedFlights.flatMap(function(f){ return [f.DEP,f.ARR,f.ALT,f.ENR1,f.ENR2,f.ENR3].map(function(s){return s? String(s).trim().toUpperCase():'';}).filter(Boolean); }))];
          var hasWarn=false;
          stationsForCheck.forEach(function(stn){
            var isNoSig=!!noSigStationMap[stn];
            var hasSelForStn = selectedFlights.some(function(f){
              var uses=[f.DEP,f.ARR,f.ALT,f.ENR1,f.ENR2,f.ENR3].map(function(x){return x? String(x).trim().toUpperCase():'';});
              return uses.indexOf(stn)!==-1 && (savedNotamAnalysis[f.FLIGHT]||[]).length>0;
            });
            if(isNoSig && hasSelForStn) hasWarn=true;
          });
          if(hasWarn) printTerminalLine("WARN: Station flagged NO SIG but has selected NOTAMs — actual NOTAM will be shown (B).", "warn");
        }catch(e){}
       

        google.script.run
          .withSuccessHandler(res => {
              clearInterval(statusCycle);
               if (res.status === "SUCCESS") {
                   printTerminalLine(`SUCCESS: ${res.message}`, "success");
                   const rawUrl = String(res.url || '').trim();
                   
                   // Render ORIGINAL /briefing link (backward compat)
                   if (isValidReportUrl(rawUrl)) {
                       printTerminalLine(`<a href="${esc(rawUrl)}" target="_blank" rel="noopener noreferrer" style="color:inherit; text-decoration:underline;">[ CLICK HERE TO OPEN GENERATED BRIEFING PACKAGE ]</a>`, "success", { allowRawHtml: true });
                   } else {
                       printTerminalLine("PACKAGE GENERATED BUT NO VALID HTTPS URL WAS RETURNED.", "warn");
                   }
                   
                   // Build form URL from flights param
                   const callSigns = selectedFlights.map(function(f){ return f.FLIGHT; }).filter(Boolean);
                   if (callSigns.length > 0) {
                       const formUrl = '/briefing-form?flights=' + encodeURIComponent(callSigns.join(','));
                       printTerminalLine(`<a href="${esc(formUrl)}" target="_blank" rel="noopener noreferrer" style="color:inherit; text-decoration:underline;">[ OPEN EDITABLE BRIEFING FORM ]</a>`, "success", { allowRawHtml: true });
                   }
                   
                   btn.innerHTML = `GENERATE COMPLETE`;
               } else {
                   printTerminalLine(`EXCEPTION: ${res.message}`, "error");
                   btn.disabled = false;
                   btn.innerHTML = `RETRY GENERATION`;
               }
                if (btnOpenForm && selectedFlights.length > 0) btnOpenForm.disabled = false;
                const _bs = document.getElementById('btn-download-sheet');
                if (_bs && selectedFlights.length > 0) _bs.disabled = false;
                window.reportState.isBusy = false;
                if (window.updateGoogleReportButton) window.updateGoogleReportButton();
            })
           .withFailureHandler(err => { 
               clearInterval(statusCycle);
               printTerminalLine(`FATAL ERROR: ${err.message}`, "error");
               btn.disabled = false;
               btn.innerHTML = `RETRY GENERATION`;
               if (btnOpenForm && selectedFlights.length > 0) btnOpenForm.disabled = false;
               const _bs2 = document.getElementById('btn-download-sheet');
               if (_bs2 && selectedFlights.length > 0) _bs2.disabled = false;
               window.reportState.isBusy = false;
               if (window.updateGoogleReportButton) window.updateGoogleReportButton();
           })
          .generateBriefingPackage(selectedFlights, savedNotamAnalysis, noSigStationMap);
    };
  </script>
  <script src="/report-google-sheets.js"></script>
</div>
