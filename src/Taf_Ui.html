<div id="view-taf" class="view-section">
  <div class="header-container" style="display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 32px; flex-wrap: wrap; gap: 20px;">
    <div>
      <h2 class="header-title">TAF MANAGER</h2>
      <p class="header-sub">Manage Terminal Aerodrome Forecasts for Station Registry</p>
    </div>
    <div style="display: flex; gap: 12px; flex-wrap: wrap; align-items: center;">
      <div style="position: relative; margin-right: 8px;">
        <svg class="ic" style="position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: var(--text-muted);"><use href="#i-search"/></svg>
        <input type="text" id="taf-search-input" onkeyup="window.renderTafTable()" placeholder="Search ICAO..." aria-label="Search TAF by ICAO"
          style="background: var(--bg-panel-sunken); border: 1px solid var(--border-light); color: var(--text-primary); padding: 8px 12px 8px 32px; border-radius: var(--radius-sm); font-family: var(--font-mono); font-size: 12px; width: 140px; transition: all 0.2s;">
      </div>
      <button onclick="window.syncWithBoard()" class="control-btn" style="background: var(--bg-void); color: var(--status-warning); border-color: var(--status-warning);"><svg class="ic ic-sm"><use href="#i-sync"/></svg> SYNC WITH BOARD</button>
      <button onclick="window.addNewTafRow()" class="control-btn" style="border-style: dashed;"><svg class="ic ic-sm"><use href="#i-plus"/></svg> ADD STATION</button>
      <button onclick="window.fetchLatestTafs(event)" class="control-btn btn-solid-primary"><svg class="ic ic-sm"><use href="#i-bolt"/></svg> FETCH LATEST</button>
      <button onclick="window.saveTafToSpreadsheet(event)" class="control-btn btn-solid-primary"><svg class="ic ic-sm"><use href="#i-save"/></svg> SAVE ALL</button>
    </div>
  </div>

  <div id="taf-confirmbar" class="taf-confirmbar" role="alertdialog" aria-label="TAF confirmation" hidden>
    <span id="taf-confirm-msg" class="taf-confirm-msg"></span>
    <span class="taf-confirm-actions">
      <button id="taf-confirm-no" class="control-btn" type="button">CANCEL</button>
      <button id="taf-confirm-yes" class="control-btn btn-solid-primary" type="button">YES</button>
    </span>
  </div>
  <div id="taf-toastbox" class="taf-toastbox" aria-live="polite"></div>

  <p class="taf-legend" aria-label="Legenda freshness TAF">
    <span class="lg-dot lg-fresh" aria-hidden="true"></span>FRESH &lt;6 h
    <span class="lg-dot lg-stale" aria-hidden="true"></span>STALE 6–24 h
    <span class="lg-dot lg-old" aria-hidden="true"></span>EXPIRED &gt;24 h / FUTURE
    <span class="lg-dot lg-new" aria-hidden="true"></span>NEW no sync yet
    <span aria-hidden="true">·</span>order: DEP→ARR→ALT→ENR→MANUAL
  </p>

  <div class="kpi-grid">
    <div class="kpi-card accent"><span class="kpi-label">Registered Stations</span><span class="kpi-val" id="taf-kpi-stations">0</span><span class="kpi-sub">aerodrome registry</span></div>
    <div class="kpi-card warn"><span class="kpi-label">On Active Board</span><span class="kpi-val" id="taf-kpi-active">0</span><span class="kpi-sub">stations in current ops</span></div>
    <div class="kpi-card safe"><span class="kpi-label">Data Freshness</span><span class="kpi-val" style="font-size:16px; padding-top:6px;">TRACKING</span><span class="kpi-sub">auto age-check</span></div>
  </div>

  <div id="taf-grid" class="taf-grid">
     <!-- Cards will be injected here -->
  </div>
</div>

  <script>
    let localTafData = [];

    window.tafToast = function(msg, kind) {
      const box = document.getElementById('taf-toastbox');
      if (!box) return;
      const t = document.createElement('div');
      t.className = 'taf-toast ' + (kind === 'error' ? 'tt-error' : kind === 'ok' ? 'tt-ok' : 'tt-info');
      t.setAttribute('role', kind === 'error' ? 'alert' : 'status');
      t.textContent = msg;
      box.appendChild(t);
      while (box.children.length > 3) box.firstChild.remove();
      setTimeout(function() {
        t.classList.add('tt-out');
        setTimeout(function() { t.remove(); }, 320);
      }, 4200);
    };

    window.tafConfirm = function(msg, okLabel) {
      return new Promise(function(resolve) {
        const bar = document.getElementById('taf-confirmbar');
        const m = document.getElementById('taf-confirm-msg');
        const yes = document.getElementById('taf-confirm-yes');
        const no = document.getElementById('taf-confirm-no');
        if (!bar || !yes || !no) { resolve(window.confirm(msg)); return; }
        m.textContent = msg;
        yes.textContent = okLabel || 'YES';
        bar.hidden = false;
        no.focus();
        const onKey = function(e) { if (e.key === 'Escape') done(false); };
        function done(v) {
          bar.hidden = true;
          yes.onclick = null; no.onclick = null;
          document.removeEventListener('keydown', onKey);
          resolve(v);
        }
        document.addEventListener('keydown', onKey);
        yes.onclick = function() { done(true); };
        no.onclick = function() { done(false); };
      });
    };

    window.tafBoardError = function(msg) {
      const grid = document.getElementById('taf-grid');
      if (!grid) return;
      const e = window.escapeHtml || function(s) { return String(s == null ? '' : s); };
      grid.innerHTML = '<div role="alert" style="grid-column: 1/-1; padding: 48px; text-align: center; color: var(--status-critical); font-family: var(--font-mono); border: 2px dashed var(--status-critical); border-radius: var(--radius-lg);">' + e(msg) + '<br><button type="button" class="control-btn btn-solid-primary" style="margin-top: 12px;" onclick="window.initTafManager()">RETRY LOAD</button></div>';
    };

    window.saveTafDataGuarded = function(data, opts) {
      opts = opts || {};
      // Skip empty-STATION rows for the backend payload - empty rows stay editable locally.
      const payload = (data || []).filter(d => ((d && d.STATION) || '').trim() !== '');
      if (typeof google === 'undefined' || !google.script || !google.script.run) {
        if (!opts.silent) window.tafToast('BRIDGE UNAVAILABLE — changes are kept local only.', 'error');
        if (opts.onErr) opts.onErr();
        return;
      }
      let settled = false;
      const to = setTimeout(function() {
        if (settled) return; settled = true;
        window.tafToast('SAVE TIMEOUT (15s) — click SAVE ALL to retry.', 'error');
        if (opts.onErr) opts.onErr();
      }, 15000);
      try {
        google.script.run
          .withSuccessHandler(function() {
            if (settled) return; settled = true; clearTimeout(to);
            if (!opts.silent) window.tafToast('TAF registry saved.', 'ok');
            if (opts.onOk) opts.onOk();
          })
          .withFailureHandler(function() {
            if (settled) return; settled = true; clearTimeout(to);
            window.tafToast('SAVE FAILED — click SAVE ALL to retry.', 'error');
            if (opts.onErr) opts.onErr();
          })
          .saveTafData(payload);
      } catch (e) {
        if (settled) return; settled = true; clearTimeout(to);
        window.tafToast('SAVE FAILED — click SAVE ALL to retry.', 'error');
        if (opts.onErr) opts.onErr();
      }
    };

    window.initTafManager = function() {
      console.log('[TAF] Initializing Manager...');
      if (typeof google === 'undefined' || !google.script || !google.script.run) {
        window.tafBoardError('BRIDGE UNAVAILABLE — open via Index shell or click RETRY.');
        return;
      }
      let settled = false;
      const to = setTimeout(function() {
        if (settled) return; settled = true;
        window.tafBoardError('LOAD TIMEOUT (20s, getTafData did not respond) — click RETRY.');
      }, 20000);
      google.script.run
        .withSuccessHandler(data => {
          if (settled) return; settled = true; clearTimeout(to);
          localTafData = data;
          // Auto-sync missing airports from board on load
          Promise.resolve(window.syncWithBoard(true)).catch(err => console.error('[TAF] sync error:', err));
          window.renderTafTable();
        })
        .withFailureHandler(err => {
          if (settled) return; settled = true; clearTimeout(to);
          console.error('[TAF] Failed to load TAF data:', err);
          window.tafBoardError('LOAD FAILED (getTafData request failed) — click RETRY.');
        })
        .getTafData();
    }

    window.tafBoardOrder = function() {
      const activeIds = window.activeBoardRowIds || [];
      const dbFlights = window.allDbFlights || [];
      const rankOf = {}, seenAt = {}, roles = {};
      function add(icao, role, rank) {
        if (!icao) return;
        const k = String(icao).trim().toUpperCase(); if (!k) return;
        if (!roles[k]) roles[k] = [];
        if (roles[k].indexOf(role) === -1) roles[k].push(role);
        if (!(k in rankOf)) { rankOf[k] = rank; seenAt[k] = Object.keys(seenAt).length; }
        else if (rank < rankOf[k]) rankOf[k] = rank;
      }
      dbFlights.filter(f => activeIds.includes(f.rowIdx)).forEach(function(f) {
        add(f.DEP, 'DEP', 0); add(f.ARR, 'ARR', 1); add(f.ALT, 'ALT', 2);
        add(f.ENR1, 'ENR', 3); add(f.ENR2, 'ENR', 3); add(f.ENR3, 'ENR', 3);
      });
      const ranked = Object.keys(rankOf).map(function(k) { return { icao: k, rank: rankOf[k] }; })
        .sort(function(a, b) { return (a.rank - b.rank) || (seenAt[a.icao] - seenAt[b.icao]); });
      return { ranked: ranked, rankOf: rankOf, roles: roles };
    };

    /**
     * Gathers all unique ICAOs from the active board (DEP, ARR, ALT, ENR1-3)
     * and ensures they exist in the localTafData list.
     */
    window.syncWithBoard = async function(silent = false) {
      const order = window.tafBoardOrder();
      window.tafRoles = order.roles;
      const activeIcaos = new Set(order.ranked.map(function(e) { return e.icao; }));
      const beforeSig = localTafData.map(function(d) { return ((d.STATION || '').trim()).toUpperCase(); }).join('|');

      let addedCount = 0;
      order.ranked.forEach(function(e) {
        const exists = localTafData.some(d => ((d.STATION || '').trim().toUpperCase()) === e.icao);
        if (!exists) {
          localTafData.push({ STATION: e.icao, RAW_TAF: '', TIMESTAMP: '' });
          addedCount++;
        }
      });

      // Dedupe: keep first occurrence (case-insensitive), drop the rest
      const seenDup = new Set();
      let dupRemoved = 0;
      localTafData = localTafData.filter(function(d) {
        const k = ((d.STATION || '').trim()).toUpperCase();
        if (k && seenDup.has(k)) { dupRemoved++; return false; }
        if (k) seenDup.add(k);
        return true;
      });

      // Default order: DEP -> ARR -> ALT -> ENR (board order); MANUAL/stale keep relative order at end
      const boardPos = {};
      order.ranked.forEach(function(e, i) { if (!(e.icao in boardPos)) boardPos[e.icao] = i; });
      const onBoard = [], manual = [];
      localTafData.forEach(function(d) {
        const k = ((d.STATION || '').trim()).toUpperCase();
        if (k && (k in boardPos)) onBoard.push(d); else manual.push(d);
      });
      onBoard.sort(function(a, b) {
        const ka = ((a.STATION || '').trim()).toUpperCase(), kb = ((b.STATION || '').trim()).toUpperCase();
        return (order.rankOf[ka] - order.rankOf[kb]) || (boardPos[ka] - boardPos[kb]);
      });
      localTafData = onBoard.concat(manual);
      const afterSig = localTafData.map(function(d) { return ((d.STATION || '').trim()).toUpperCase(); }).join('|');
      const orderChanged = afterSig !== beforeSig;

      // Identify stations in registry that are no longer on the board
      const staleStations = localTafData.filter(d => d.STATION && !activeIcaos.has(d.STATION.trim().toUpperCase()));

      if (!silent) {
        const dupMsg = dupRemoved > 0 ? ` ${dupRemoved} duplicate(s) removed.` : '';
        if (staleStations.length > 0) {
          let msg = '';
          if (addedCount > 0) msg += `Added ${addedCount} missing station(s) from the Active Board. `;
          const ok = await window.tafConfirm(msg + `Remove ${staleStations.length} station(s) missing from the Flight Board from the TAF list?`, 'REMOVE');
          if (ok) {
            // UPDATE the local array FIRST
            localTafData = localTafData.filter(d => d.STATION && activeIcaos.has(d.STATION.trim().toUpperCase()));
            // Save changes to backend immediately (guarded)
            window.saveTafDataGuarded(localTafData, { silent: true });
            window.tafToast(`Sync complete: +${addedCount} station, -${staleStations.length} station.${dupMsg} Order: DEP→ARR→ALT→ENR→MANUAL.`, 'ok');
          } else {
            window.saveTafDataGuarded(localTafData, { silent: true });
          }
        } else if (addedCount === 0 && dupRemoved === 0 && !orderChanged) {
          window.tafToast('Registry is already in sync with the Flight Board.', 'info');
        } else {
          // If only added, save it as well (guarded)
          window.saveTafDataGuarded(localTafData, { silent: true });
          window.tafToast(`Sync complete: +${addedCount} station dari Active Board.${dupMsg} Order: DEP→ARR→ALT→ENR→MANUAL.`, 'ok');
        }

        // Render ONLY AFTER the array is updated
        window.renderTafTable();
      } else {
        // For silent auto-sync on load, we don't ask for permission to delete, we just render
        if (addedCount > 0 || dupRemoved > 0 || orderChanged) {
          window.saveTafDataGuarded(localTafData, { silent: true });
        }
        window.renderTafTable();
      }
    };

    window.renderTafTable = function() {
      const grid = document.getElementById('taf-grid');
      if (!grid) return;
      grid.innerHTML = '';
      const esc = window.escapeHtml || function(s) { return String(s == null ? '' : s); };

      // Board order + roles from single source (ranked DEP->ARR->ALT->ENR)
      const order = window.tafBoardOrder();
      window.tafRoles = order.roles;
      const activeIcaos = new Set(order.ranked.map(function(e) { return e.icao; }));

      // Get search query
      const searchInput = document.getElementById('taf-search-input');
      const query = searchInput ? searchInput.value.toUpperCase() : '';

      if (localTafData.length === 0) {
        grid.innerHTML = `<div style="grid-column: 1/-1; padding: 60px; text-align: center; color: var(--text-muted); font-family: var(--font-mono); border: 2px dashed var(--border-light); border-radius: var(--radius-lg);">[ NO AERODROME REGISTRY FOUND ]</div>`;
        return;
      }

      let displayedCount = 0;

      localTafData.forEach((item, index) => {
        const stationIcao = ((item.STATION || '').trim()).toUpperCase();
        
        // Apply search filter
        if (query && !stationIcao.includes(query)) {
          return; // Skip rendering this card
        }
        
        displayedCount++;
        const isActive = activeIcaos.has(stationIcao);
        const card = document.createElement('div');
        card.className = 'taf-card';
        card.setAttribute('draggable', 'true');
        if (isActive) card.style.borderColor = 'var(--status-warning)';
        
        // Freshness uses UTC interpretation of stored timestamps
        let freshnessClass = 'fresh-new';
        let freshnessText = 'NEW ENTRY';
        if (item.TIMESTAMP) {
          try {
            var rawTs = String(item.TIMESTAMP).trim();
            var tsISO = rawTs.replace(' ', 'T').replace(/\//g, '-');
            if (tsISO && tsISO.slice(-1) !== 'Z' && tsISO.indexOf('+') === -1 && /T\d{2}:\d{2}/.test(tsISO)) tsISO += 'Z';
            var updateTime = new Date(tsISO);
            var now = new Date();
            if (!isNaN(updateTime.getTime())) {
              var diffHours = (now - updateTime) / (1000 * 60 * 60);
              if (diffHours < 0) { freshnessClass = 'fresh-old'; freshnessText = 'FUTURE'; }
              else if (diffHours < 6) { freshnessClass = 'fresh-safe'; freshnessText = 'FRESH'; }
              else if (diffHours < 24) { freshnessClass = 'fresh-warn'; freshnessText = 'STALE'; }
              else { freshnessClass = 'fresh-old'; freshnessText = 'EXPIRED'; }
            }
          } catch(e) { console.warn("Date parse error:", e); }
        }

        card.innerHTML = 
          '<div class="taf-card-header">' +
            '<div style="display:flex; align-items:center; gap:8px;">' +
              '<span class="taf-grip" data-grip tabindex="0" role="button" title="Drag to reorder" aria-label="Move station ' + esc(item.STATION || 'empty') + '"></span>' +
              '<input type="text" class="taf-input" value="' + esc(item.STATION) + '" ' +
                'onchange="window.updateLocalTaf(' + index + ', \'STATION\', this.value, this)" ' +
                'placeholder="ICAO" title="Station ICAO" aria-label="TAF station ICAO">' +
              (function() {
                const rls = (window.tafRoles && window.tafRoles[stationIcao]) || [];
                const prim = ['DEP', 'ARR', 'ALT', 'ENR'].find(function(r) { return rls.indexOf(r) !== -1; });
                if (prim) return '<span class="taf-role" title="' + esc(rls.join('/')) + '">' + prim + '</span>';
                if (stationIcao) return '<span class="taf-role manual" title="Added manually">MANUAL</span>';
                return '';
              })() +
              (isActive ? '<span style="color:var(--status-warning); font-size:10px; font-weight:900;">[ACTIVE]</span>' : '') +
              (item.IS_UNAVAILABLE ? '<span style="color:var(--status-critical); background:var(--status-critical-bg); padding: 2px 6px; border-radius: 4px; font-size:10px; font-weight:900; margin-left: 6px;">[ N/A ]</span>' : '') +
            '</div>' +
            '<button onclick="window.removeTafRow(' + index + ')" class="taf-btn-delete" title="Remove Station" aria-label="Remove TAF station"><svg class="ic"><use href="#i-x"/></svg></button>' +
          '</div>' +
          '<div class="taf-card-body">' +
            '<span style="font-size: 9px; font-weight: 800; color: var(--text-muted); letter-spacing: 0.1em; text-transform: uppercase;">Raw Forecast</span>' +
            '<textarea class="taf-textarea" spellcheck="false" aria-label="Raw TAF forecast" ' +
              'onchange="window.updateLocalTaf(' + index + ', \'RAW_TAF\', this.value)">' + esc(item.RAW_TAF) + '</textarea>' +
          '</div>' +
          '<div class="taf-card-footer">' +
            '<div style="display: flex; flex-direction: column; gap: 2px;">' +
              '<span>LATEST SYNC (Z)</span>' +
              '<span style="color:var(--text-primary); font-weight:700;">' + esc(item.TIMESTAMP) + '</span>' +
            '</div>' +
            '<span class="freshness-badge ' + freshnessClass + '">' + freshnessText + '</span>' +
          '</div>';

        grid.appendChild(card);
      });

      if (displayedCount === 0 && query) {
        grid.innerHTML = `<div style="grid-column: 1/-1; padding: 60px; text-align: center; color: var(--text-muted); font-family: var(--font-mono); border: 2px dashed var(--border-light); border-radius: var(--radius-lg);">[ NO STATIONS MATCHING '${esc(query)}' ]</div>`;
      }

      const kpiStations = document.getElementById('taf-kpi-stations');
      if (kpiStations) kpiStations.innerText = localTafData.length;
      const kpiActive = document.getElementById('taf-kpi-active');
      if (kpiActive) kpiActive.innerText = activeIcaos.size;
    };

  window.occFormatUtcTimestamp_ = function(d) {
    var dd = d instanceof Date ? d : new Date();
    return dd.toISOString().slice(0, 19).replace('T', ' ') + 'Z';
  };
  window.updateLocalTaf = function(index, field, value, el) {
    if (!localTafData[index]) return;
    if (field === 'STATION') {
      const newVal = value.trim().toUpperCase();
      const isDuplicate = localTafData.some((item, i) => i !== index && (item.STATION || "").toUpperCase() === newVal);
      if (isDuplicate && newVal !== "") {
        window.tafToast(`Station ${newVal} is already in the list!`, 'error');
        if (el) el.value = localTafData[index].STATION;
        return;
      }
      localTafData[index].STATION = newVal;
      window.renderTafTable();
    } 
    else if (field === 'RAW_TAF') {
      localTafData[index].RAW_TAF = value;
      localTafData[index].IS_UNAVAILABLE = false;
      localTafData[index].TIMESTAMP = window.occFormatUtcTimestamp_(new Date());
      window.renderTafTable(); 
    }
  }

  window.addNewTafRow = function() {
    localTafData.unshift({
      STATION: '',
      RAW_TAF: '',
      TIMESTAMP: ''
    });
    window.renderTafTable();
  }

    window.removeTafRow = async function(index) {
      const st = (localTafData[index] && localTafData[index].STATION) || '';
      const ok = await window.tafConfirm(`Remove station ${st || '(empty)'} from the TAF registry?`, 'REMOVE');
      if (ok) {
        localTafData.splice(index, 1);
        window.renderTafTable();
      }
    }

  window.fetchLatestTafs = function(event) {
    const icaoList = localTafData.map(d => d.STATION).filter(s => s.length >= 3);
    if (icaoList.length === 0) {
      window.tafToast('Please add station ICAO codes first.', 'info');
      return;
    }

    const fetchBtn = event?.currentTarget || event?.srcElement || document.activeElement;
    const originalText = fetchBtn ? fetchBtn.innerText : 'FETCH LATEST';
    if (fetchBtn) {
      fetchBtn.innerText = 'SYNCING...';
      fetchBtn.disabled = true;
    }

    google.script.run
      .withSuccessHandler(tafMap => {
        if (fetchBtn) {
          fetchBtn.innerText = originalText;
          fetchBtn.disabled = false;
        }
        
        let updateCount = 0;
        localTafData.forEach(item => {
          const key = item.STATION.toUpperCase();
          if (tafMap[key]) {
            item.RAW_TAF = tafMap[key];
            item.IS_UNAVAILABLE = false;
            item.TIMESTAMP = window.occFormatUtcTimestamp_(new Date());
            updateCount++;
          } else if (key.length >= 3) {
            item.IS_UNAVAILABLE = true;
          }
        });
        
        window.renderTafTable();
      })
      .withFailureHandler(err => {
        if (fetchBtn) {
          fetchBtn.innerText = originalText;
          fetchBtn.disabled = false;
        }
        window.tafToast('TAF fetch failed — API might be unreachable.', 'error');
      })
      .fetchLatestTafFromApi(icaoList);
  }

  window.saveTafToSpreadsheet = function(event) {
    const saveBtn = event?.currentTarget || event?.srcElement || document.activeElement;
    const originalText = saveBtn ? saveBtn.innerText : 'SAVE ALL';
    if (saveBtn) {
      saveBtn.innerText = 'SAVING...';
      saveBtn.disabled = true;
    }

    window.saveTafDataGuarded(localTafData, {
      silent: true,
      onOk: function() {
        if (saveBtn) {
          saveBtn.innerText = originalText;
          saveBtn.disabled = false;
        }
        window.initTafManager();
      },
      onErr: function() {
        if (saveBtn) {
          saveBtn.innerText = originalText;
          saveBtn.disabled = false;
        }
      }
    });
  }

  window.tafPersistOrder = function() {
    const grid = document.getElementById('taf-grid');
    if (!grid || !grid.querySelectorAll) return;
    const order = [];
    const cards = grid.querySelectorAll('#taf-grid > .taf-card');
    for (let i = 0; i < cards.length; i++) {
      const inp = cards[i].querySelector ? cards[i].querySelector('.taf-input') : null;
      order.push(inp ? inp.value : '');
    }
    const pool = localTafData.slice();
    const next = [];
    order.forEach(function(st) {
      const key = (st || '').toUpperCase();
      for (let i = 0; i < pool.length; i++) {
        if (((pool[i].STATION || '').toUpperCase()) === key) { next.push(pool.splice(i, 1)[0]); break; }
      }
    });
    localTafData.length = 0;
    next.concat(pool).forEach(function(d) { localTafData.push(d); });
    window.saveTafDataGuarded(localTafData, { silent: true,
      onOk: function() { window.tafToast('Station order saved.', 'ok'); window.renderTafTable(); },
      onErr: function() { window.renderTafTable(); }
    });
  };

  window.tafMoveStation = function(station, dir) {
    const key = (station || '').toUpperCase();
    const i = localTafData.findIndex(function(d) { return ((d.STATION || '').toUpperCase()) === key; });
    const j = i + dir;
    if (i < 0 || j < 0 || j >= localTafData.length) return false;
    const tmp = localTafData[i]; localTafData[i] = localTafData[j]; localTafData[j] = tmp;
    window.saveTafDataGuarded(localTafData, { silent: true,
      onOk: function() { window.tafToast('Station order saved.', 'ok'); window.renderTafTable(); focusGrip(key); },
      onErr: function() { window.renderTafTable(); }
    });
    return true;
    function focusGrip(k) {
      try {
        const grid = document.getElementById('taf-grid');
        if (!grid || !grid.querySelectorAll) return;
        const inputs = grid.querySelectorAll('.taf-card .taf-input');
        for (let n = 0; n < inputs.length; n++) {
          if (((inputs[n].value || '').toUpperCase()) === k) {
            const card = inputs[n].closest ? inputs[n].closest('.taf-card') : null;
            const grip = card && card.querySelector ? card.querySelector('[data-grip]') : null;
            if (grip && grip.focus) grip.focus();
            break;
          }
        }
      } catch (_) {}
    }
  };

  (function tafReorderInit() {
    if (window.__tafReorder) return; window.__tafReorder = true;
    let dragCard = null;
    function inGrid(el) {
      if (!el || !el.closest) return null;
      const card = el.closest('.taf-card');
      if (!card) return null;
      const grid = document.getElementById('taf-grid');
      if (!grid || !grid.contains(card)) return null;
      return card;
    }
    document.addEventListener('dragstart', function(e) {
      const card = inGrid(e.target);
      if (!card) return;
      const fromInteractive = pressEl && pressEl.closest ? pressEl.closest('input,textarea,select,button,a') : null;
      const pressInCard = pressEl && card.contains ? card.contains(pressEl) : true;
      if (fromInteractive || !pressInCard) { if (e.preventDefault) e.preventDefault(); return; }
      dragCard = card;
      try { e.dataTransfer.setData('text/plain', 'taf-card'); e.dataTransfer.effectAllowed = 'move'; } catch (_) {}
      setTimeout(function() { card.classList.add('is-dragging'); }, 0);
    });
    document.addEventListener('dragend', function() {
      try {
        if (dragCard) dragCard.classList.remove('is-dragging');
        const grid = document.getElementById('taf-grid');
        if (grid) grid.querySelectorAll('.drop-swap').forEach(function(x) { x.classList.remove('drop-swap'); });
      } catch (_) {}
      dragCard = null;
    });
    function targetUnder(grid, x, y) {
      const cards = grid.querySelectorAll('#taf-grid > .taf-card');
      for (let i = 0; i < cards.length; i++) {
        if (cards[i] === dragCard) continue;
        const r = cards[i].getBoundingClientRect();
        if (x >= r.left && x <= r.right && y >= r.top && y <= r.bottom) return cards[i];
      }
      return null;
    }
    document.addEventListener('dragover', function(e) {
      const grid = document.getElementById('taf-grid');
      if (!grid || !dragCard || !grid.contains(dragCard)) return;
      if (!e.target.closest || !e.target.closest('#taf-grid')) return;
      if (e.preventDefault) e.preventDefault();
      try { e.dataTransfer.dropEffect = 'move'; } catch (_) {}
      grid.querySelectorAll('.drop-swap').forEach(function(x) { x.classList.remove('drop-swap'); });
      const target = targetUnder(grid, e.clientX, e.clientY);
      if (target) target.classList.add('drop-swap');
    });
    document.addEventListener('drop', function(e) {
      const grid = document.getElementById('taf-grid');
      if (!grid || !dragCard || !grid.contains(dragCard)) return;
      if (!e.target.closest || !e.target.closest('#taf-grid')) return;
      if (e.preventDefault) e.preventDefault();
      const target = targetUnder(grid, e.clientX, e.clientY);
      if (!target) { try { dragCard.classList.remove('is-dragging'); } catch (_) {} dragCard = null; return; }
      const marker = document.createTextNode('');
      grid.insertBefore(marker, dragCard);
      grid.insertBefore(dragCard, target);
      grid.insertBefore(target, marker);
      if (marker.remove) marker.remove(); else marker.parentNode.removeChild(marker);
      try { dragCard.classList.remove('is-dragging'); } catch (_) {}
      dragCard = null;
      window.tafPersistOrder();
    });
    let pressEl = null;
    document.addEventListener('mousedown', function(e) {
      pressEl = (e.target && e.target.closest) ? e.target : null;
    });
    document.addEventListener('mouseup', function() {
      pressEl = null;
    });
    document.addEventListener('keydown', function(e) {
      const t = e.target; if (!t || !t.closest) return;
      const g = t.closest('[data-grip]'); if (!g) return;
      if (e.key !== 'ArrowUp' && e.key !== 'ArrowDown') return;
      if (e.preventDefault) e.preventDefault();
      const card = g.closest('.taf-card'); if (!card) return;
      const inp = card.querySelector ? card.querySelector('.taf-input') : null;
      window.tafMoveStation(inp ? inp.value : '', e.key === 'ArrowUp' ? -1 : 1);
    });
  })();
</script>
